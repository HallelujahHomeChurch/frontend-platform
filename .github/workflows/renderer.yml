name: Verify bulletin renderer shards

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      selection:
        required: false
        type: string
        default: ""
      verify-release:
        required: false
        type: boolean
        default: false
      matrix:
        required: true
        type: string
      workspace-sha:
        required: true
        type: string
      image-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Validate selection identity
        env:
          SELECTION: ${{ inputs.selection || inputs.mode }}
          MODE: ${{ inputs.mode }}
          VERIFY_RELEASE: ${{ inputs.verify-release }}
        run: |
          case "$MODE/$SELECTION" in ci/ci|release/release|release/release-check) ;; *) exit 1 ;; esac
          if [ "$VERIFY_RELEASE" = true ]; then test "$MODE/$SELECTION" = ci/ci; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renderer-inputs
      - name: Verify and restore the prepared workspace and image
        env:
          WORKSPACE_SHA: ${{ inputs.workspace-sha }}
          IMAGE_SHA: ${{ inputs.image-sha }}
        run: |
          printf '%s  %s\n' "$WORKSPACE_SHA" "$RUNNER_TEMP/renderer-inputs/renderer-workspace.tar" | sha256sum --check --strict
          printf '%s  %s\n' "$IMAGE_SHA" "$RUNNER_TEMP/renderer-inputs/renderer-image.tar" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/renderer-inputs/renderer-workspace.tar"
          docker load -i "$RUNNER_TEMP/renderer-inputs/renderer-image.tar"
      - if: inputs.mode == 'ci'
        run: corepack enable
      - if: inputs.mode == 'ci'
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Measure with pinned Chromium and verified producer fonts
        env:
          HHC_BULLETIN_TEMPLATE_DIR: ${{ github.workspace }}/artifacts/bulletin-renderer/assets
          RENDERER_SHARD: ${{ matrix.shard }}
          RENDERER_MODE: ${{ inputs.mode }}
          RENDERER_PLAN: artifacts/renderer-selection/${{ inputs.selection || inputs.mode }}.json
        run: node scripts/ci-bulletin-renderer.mjs run "$RENDERER_SHARD" renderer-results "$RENDERER_MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-result-${{ inputs.selection || inputs.mode }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: renderer-results/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify release mode on the same prepared shard
        if: inputs.mode == 'ci' && inputs.verify-release
        env:
          HHC_BULLETIN_TEMPLATE_DIR: ${{ github.workspace }}/artifacts/bulletin-renderer/assets
          RENDERER_SHARD: ${{ matrix.shard }}
          RENDERER_PLAN: artifacts/renderer-selection/release-check.json
        run: node scripts/ci-bulletin-renderer.mjs run "$RENDERER_SHARD" release-results release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'ci' && inputs.verify-release
        with:
          name: renderer-result-release-check-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-results/*.json
          if-no-files-found: error
          retention-days: 1
