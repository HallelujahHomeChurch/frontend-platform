name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: renderer-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent_docs:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify inert agent documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  immutable:
    needs: [agent_docs, prepare]
    if: ${{ always() && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the prepared immutable validation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARE_RESULT" = success

  prepare:
    needs: agent_docs
    if: ${{ !cancelled() && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    outputs:
      verify-release: ${{ steps.selection.outputs.verify-release }}
      matrix: ${{ steps.bundle.outputs.matrix }}
      workspace-sha: ${{ steps.bundle.outputs.workspace-sha }}
      image-sha: ${{ steps.bundle.outputs.image-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: corepack pnpm build
      - name: Verify immutable mutation and removal cases
        run: node --test scripts/verify-bulletin-renderer.test.mjs
      - name: Verify renderer CI coverage and aggregate gate
        run: |
          node --test scripts/ci-bulletin-renderer.test.mjs scripts/renderer-selection.test.mjs scripts/seal-renderer-checkpoint.test.mjs scripts/publish-packages.test.mjs scripts/publish-renderer-image.test.mjs
          python3 -m unittest discover -s scripts -p test_renderer_checkpoint.py
          python3 -m unittest discover -s scripts -p test_restore_release_publication.py
      - name: Verify immutable bulletin renderer
        run: |
          node scripts/verify-bulletin-renderer-v11.mjs --base-ref origin/main
          python3 -m unittest discover -s scripts -p test_bulletin_corpus.py
      - name: Package the verified renderer once
        env:
          HHC_BULLETIN_TEMPLATE_DIR: ${{ runner.temp }}/bulletin-template-v1
        run: |
          node scripts/fetch-bulletin-template-assets.mjs "$HHC_BULLETIN_TEMPLATE_DIR"
          node --test scripts/package-bulletin-renderer.test.mjs
          node scripts/package-bulletin-renderer.mjs artifacts/bulletin-renderer "$HHC_BULLETIN_TEMPLATE_DIR"
          docker build -f tools/bulletin-renderer/Dockerfile -t hhc-bulletin-renderer:verify artifacts/bulletin-renderer
          node --test scripts/renderer-runtime-fingerprint.test.mjs
      - run: corepack pnpm test
      - run: corepack pnpm lint
      - run: corepack pnpm --filter @hallelujahhomechurch/hhc-web-client check:generated
      - run: corepack pnpm --filter @hallelujahhomechurch/hhc-web-client check:bulletin
      - run: corepack pnpm --filter @hallelujahhomechurch/donation-client check:generated
      - run: corepack pnpm --filter @hallelujahhomechurch/operations-client check:generated
      - run: corepack pnpm check:packages
      - name: Pack reproducible release artifacts
        run: node --test scripts/pack-packages.test.mjs
      - run: corepack pnpm test:consumers
      - name: Restore trusted release evidence or require full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/renderer-checkpoint.py
      - name: Prepare CI and release selection plans from verified inputs
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RENDERER_FORCE_FULL: ${{ vars.RENDERER_FORCE_FULL }}
        run: node scripts/prepare-renderer-selection.mjs
      - name: Bundle immutable inputs for the same-run shards
        id: bundle
        env:
          RENDERER_MODE: ci
          RENDERER_PLAN: artifacts/renderer-selection/ci.json
          VERIFY_RELEASE: ${{ github.event_name == 'pull_request' && steps.selection.outputs.verify-release == 'true' }}
        run: |
          tar -cf "$RUNNER_TEMP/renderer-workspace.tar" node_modules packages artifacts/bulletin-renderer/assets artifacts/renderer-selection
          docker save hhc-bulletin-renderer:verify -o "$RUNNER_TEMP/renderer-image.tar"
          echo "workspace-sha=$(sha256sum "$RUNNER_TEMP/renderer-workspace.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image-sha=$(sha256sum "$RUNNER_TEMP/renderer-image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node scripts/ci-bulletin-renderer.mjs matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/renderer-workspace.tar
            ${{ runner.temp }}/renderer-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-selection-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/renderer-selection
          if-no-files-found: error
          retention-days: 1

  renderer:
    needs: [agent_docs, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    uses: ./.github/workflows/renderer.yml
    with:
      mode: ci
      verify-release: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.verify-release == 'true' }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      workspace-sha: ${{ needs.prepare.outputs.workspace-sha }}
      image-sha: ${{ needs.prepare.outputs.image-sha }}

  verify:
    if: ${{ always() }}
    needs: [agent_docs, immutable, prepare, renderer]
    runs-on: ubuntu-latest
    steps:
      - name: Require a proven classification
        run: |
          test "${{ needs.agent_docs.result }}" = success
          if [ "${{ needs.agent_docs.outputs.docs_only }}" = true ]; then
            test "${{ needs.immutable.result }}" = skipped
            test "${{ needs.prepare.result }}" = skipped
            test "${{ needs.renderer.result }}" = skipped
          else
            test "${{ needs.immutable.result }}" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.agent_docs.outputs.docs_only != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.agent_docs.outputs.docs_only != 'true'
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.agent_docs.outputs.docs_only != 'true'
        with:
          pattern: renderer-result-ci-*-${{ github.sha }}-${{ github.run_attempt }}
          path: renderer-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.agent_docs.outputs.docs_only != 'true'
        with:
          name: renderer-selection-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/renderer-selection
      - name: Require all validation and exact renderer coverage
        if: needs.agent_docs.outputs.docs_only != 'true'
        env:
          RENDERER_PLAN: artifacts/renderer-selection/ci.json
          CI_NEEDS: >-
            {"prepare":${{ toJSON(needs.prepare) }},
            "renderer":${{ toJSON(needs.renderer) }}}
        run: node scripts/ci-bulletin-renderer.mjs verify-results renderer-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'pull_request' && needs.prepare.outputs.verify-release == 'true'
        with:
          pattern: renderer-result-release-check-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-results
      - name: Require actual release-mode verification without publication
        if: github.event_name == 'pull_request' && needs.prepare.outputs.verify-release == 'true'
        env:
          RENDERER_PLAN: artifacts/renderer-selection/release-check.json
          CI_NEEDS: >-
            {"prepare":${{ toJSON(needs.prepare) }},
            "renderer":${{ toJSON(needs.renderer) }}}
        run: node scripts/ci-bulletin-renderer.mjs verify-results release-results release
