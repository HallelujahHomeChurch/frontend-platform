name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: corepack pnpm build
      - name: Verify immutable bulletin renderer
        run: |
          node scripts/verify-bulletin-renderer.mjs --base-ref origin/main
          node scripts/verify-bulletin-renderer-v3.mjs --base-ref origin/main
          node scripts/verify-bulletin-renderer-v4.mjs --base-ref origin/main
          node scripts/verify-bulletin-renderer-v5.mjs --base-ref origin/main
          node scripts/verify-bulletin-renderer-v6.mjs --base-ref origin/main
          node scripts/verify-bulletin-renderer-v7.mjs --base-ref origin/main
          node --test scripts/verify-bulletin-renderer.test.mjs
          python3 -m unittest discover -s scripts -p test_bulletin_corpus.py
      - name: Measure with pinned Chromium and verified producer fonts
        env:
          HHC_BULLETIN_TEMPLATE_DIR: ${{ runner.temp }}/bulletin-template-v1
        run: |
          corepack pnpm exec playwright install --with-deps chromium
          node scripts/fetch-bulletin-template-assets.mjs "$HHC_BULLETIN_TEMPLATE_DIR"
          node --test scripts/measure-bulletin-layout.test.mjs
          HHC_TEST_RENDERER_V6=1 node --test --test-concurrency=1 scripts/measure-bulletin-layout.test.mjs scripts/measure-bulletin-layout-v6.test.mjs
          HHC_TEST_RENDERER_V7=1 node --test --test-concurrency=1 scripts/measure-bulletin-layout.test.mjs scripts/measure-bulletin-layout-v6.test.mjs scripts/measure-bulletin-layout-v7.test.mjs
          node --test scripts/package-bulletin-renderer.test.mjs
          node scripts/package-bulletin-renderer.mjs artifacts/bulletin-renderer "$HHC_BULLETIN_TEMPLATE_DIR"
          docker build -f tools/bulletin-renderer/Dockerfile -t hhc-bulletin-renderer:verify artifacts/bulletin-renderer
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_TEST_RENDERER_V3=1 \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_TEST_RENDERER_V4=1 \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_TEST_RENDERER_V5=1 \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_TEST_RENDERER_V6=1 \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout-v6.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout-v6.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test --test-concurrency=1 /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs /opt/bulletin-renderer/scripts/measure-bulletin-layout-v6.test.mjs
          docker run --rm --network none --read-only --memory 2g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e HHC_TEST_RENDERER_V7=1 \
            -e HHC_BULLETIN_TEMPLATE_DIR=/opt/bulletin-renderer/assets \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout-v6.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout-v6.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/measure-bulletin-layout-v7.test.mjs,dst=/opt/bulletin-renderer/scripts/measure-bulletin-layout-v7.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/scripts/testdata,dst=/opt/bulletin-renderer/scripts/testdata,readonly" \
            --entrypoint node hhc-bulletin-renderer:verify --test --test-concurrency=1 /opt/bulletin-renderer/scripts/measure-bulletin-layout.test.mjs /opt/bulletin-renderer/scripts/measure-bulletin-layout-v6.test.mjs /opt/bulletin-renderer/scripts/measure-bulletin-layout-v7.test.mjs
      - run: corepack pnpm test
      - run: corepack pnpm lint
      - run: corepack pnpm --filter @hallelujahhomechurch/hhc-web-client check:generated
      - run: corepack pnpm --filter @hallelujahhomechurch/hhc-web-client check:bulletin
      - run: corepack pnpm --filter @hallelujahhomechurch/donation-client check:generated
      - run: corepack pnpm check:packages
      - run: corepack pnpm pack:packages
      - run: corepack pnpm test:consumers
