name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-platform-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.bundle.outputs.matrix }}
      workspace-sha: ${{ steps.bundle.outputs.workspace-sha }}
      image-sha: ${{ steps.bundle.outputs.image-sha }}
      prepared-run-id: ${{ steps.bundle.outputs.run-id }}
      prepared-attempt: ${{ steps.bundle.outputs.attempt }}
      input-artifact-id: ${{ steps.inputs.outputs.artifact-id }}
      input-artifact-digest: ${{ steps.inputs.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --db-repository ghcr.io/aquasecurity/trivy-db:2 --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace
      - run: corepack pnpm build
      - run: |
          node --test scripts/ci-bulletin-renderer.test.mjs scripts/renderer-selection.test.mjs scripts/seal-renderer-checkpoint.test.mjs scripts/publish-packages.test.mjs scripts/publish-renderer-image.test.mjs
          python3 -m unittest discover -s scripts -p test_renderer_checkpoint.py
          python3 -m unittest discover -s scripts -p test_restore_release_publication.py
      # The workspace is already built; local pretest would rebuild three packages.
      - run: corepack pnpm -r --if-present test:run
      - run: corepack pnpm lint
      - run: corepack pnpm check:packages
      - name: Verify tag
        run: |
          node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Build and verify isolated bulletin renderer
        env:
          HHC_BULLETIN_TEMPLATE_DIR: ${{ runner.temp }}/bulletin-template-v1
        run: |
          node scripts/verify-bulletin-renderer-v11.mjs
          node scripts/fetch-bulletin-template-assets.mjs "$HHC_BULLETIN_TEMPLATE_DIR"
          node --test scripts/package-bulletin-renderer.test.mjs
          node scripts/package-bulletin-renderer.mjs artifacts/bulletin-renderer "$HHC_BULLETIN_TEMPLATE_DIR"
          docker build -f tools/bulletin-renderer/Dockerfile -t hhc-bulletin-renderer:verify artifacts/bulletin-renderer
          node --test scripts/renderer-runtime-fingerprint.test.mjs
          docker save hhc-bulletin-renderer:verify -o "$RUNNER_TEMP/bulletin-renderer.tar"
          docker run --rm -v "$RUNNER_TEMP/bulletin-renderer.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --db-repository ghcr.io/aquasecurity/trivy-db:2 --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --input /image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Restore trusted release evidence or require full verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/renderer-checkpoint.py
      - name: Prepare CI and release selection plans from verified inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RENDERER_FORCE_FULL: ${{ vars.RENDERER_FORCE_FULL }}
        run: node scripts/prepare-renderer-selection.mjs
      - name: Pack reproducible release artifacts
        run: node --test scripts/pack-packages.test.mjs
      - name: Bundle immutable inputs for the same-run shards
        id: bundle
        env:
          RENDERER_MODE: release
          RENDERER_PLAN: artifacts/renderer-selection/release.json
        run: |
          tar -cf "$RUNNER_TEMP/renderer-workspace.tar" node_modules packages artifacts/bulletin-renderer/assets artifacts/renderer-selection artifacts/hallelujahhomechurch-*.tgz
          mv "$RUNNER_TEMP/bulletin-renderer.tar" "$RUNNER_TEMP/renderer-image.tar"
          echo "workspace-sha=$(sha256sum "$RUNNER_TEMP/renderer-workspace.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image-sha=$(sha256sum "$RUNNER_TEMP/renderer-image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node scripts/ci-bulletin-renderer.mjs matrix)" >> "$GITHUB_OUTPUT"
          echo "run-id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/renderer-workspace.tar
            ${{ runner.temp }}/renderer-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-selection-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/renderer-selection
          if-no-files-found: error
          retention-days: 1

  renderer:
    needs: prepare
    uses: ./.github/workflows/renderer.yml
    with:
      mode: release
      matrix: ${{ needs.prepare.outputs.matrix }}
      workspace-sha: ${{ needs.prepare.outputs.workspace-sha }}
      image-sha: ${{ needs.prepare.outputs.image-sha }}

  verify:
    outputs:
      verified-attempt: ${{ steps.receipts.outputs.attempt }}
      receipt-artifact-id: ${{ steps.verified-receipts.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.verified-receipts.outputs.artifact-digest }}
    if: ${{ always() }}
    needs: [prepare, renderer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: renderer-result-release-*-${{ github.sha }}-${{ github.run_attempt }}
          path: renderer-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-selection-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/renderer-selection
      - name: Require all validation and exact renderer coverage
        id: receipts
        env:
          RENDERER_PLAN: artifacts/renderer-selection/release.json
          RENDERER_VERIFIED_RECEIPTS: verified-receipts.json
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node scripts/ci-bulletin-renderer.mjs verify-results renderer-results release
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: verified-receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-publication-receipts-${{ github.sha }}-${{ github.run_attempt }}
          path: verified-receipts.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: corepack enable
      - name: Verify and restore the prepared workspace and image
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ needs.prepare.outputs.prepared-run-id }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.prepared-attempt }}
          VERIFIED_ATTEMPT: ${{ needs.verify.outputs.verified-attempt }}
          INPUT_ARTIFACT_ID: ${{ needs.prepare.outputs.input-artifact-id }}
          INPUT_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.input-artifact-digest }}
          RECEIPT_ARTIFACT_ID: ${{ needs.verify.outputs.receipt-artifact-id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ needs.verify.outputs.receipt-artifact-digest }}
          WORKSPACE_SHA: ${{ needs.prepare.outputs.workspace-sha }}
          IMAGE_SHA: ${{ needs.prepare.outputs.image-sha }}
        run: |
          python3 scripts/restore-release-publication.py
          printf '%s  %s\n' "$WORKSPACE_SHA" "$RUNNER_TEMP/renderer-inputs/renderer-workspace.tar" | sha256sum --check --strict
          printf '%s  %s\n' "$IMAGE_SHA" "$RUNNER_TEMP/renderer-inputs/renderer-image.tar" | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/renderer-inputs/renderer-workspace.tar"
          docker load -i "$RUNNER_TEMP/renderer-inputs/renderer-image.tar"
      - name: Reject stale release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/renderer-checkpoint.py guard
      - name: Publish packages
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable renderer image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-renderer-image.mjs
      - name: Seal successfully published release evidence
        run: node scripts/seal-renderer-checkpoint.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-evidence/checkpoint.json
          if-no-files-found: error
          retention-days: 90
