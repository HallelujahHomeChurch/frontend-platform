      type: array
      description: Present only for coverage=reader-v1; lists all datasets covered even when no rows exist. Completion still requires status completed and remainingCount zero; exports must exhaust nextCursor.
      minItems: 9
      maxItems: 9
      uniqueItems: true
      items:
        type: string
        enum: [bulletin_watermark_receipt, bulletin_watermark_investigation, online_reader_receipt, online_reader_validation, bulletin_reader_highlight, bulletin_reader_note, bulletin_reader_progress, bulletin_reader_migration_state, bulletin_reader_processed_mutation]
