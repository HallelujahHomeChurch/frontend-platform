        - { name: issueNumber, in: query, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      responses:
        '200': { description: One authoritative union page, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderDiscoveryEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/ReaderUnavailable' }
        '503': { $ref: '#/components/responses/Error' }
  /member/bulletins/{issueID}/versions/{locale}/online/access:
    post:
      operationId: openOnlineBulletin
      summary: Issue authorized structured content with a durable reader receipt
      description: Rechecks the exact PDF entitlement on every request. Content is returned only after receipt commit. Same account and clientRequestId replay the original validation window; changed inputs conflict. Receipt reuse requires the same account, document and published revision. Retained published revisions remain readable only while the edition is published. No full-content GET exists. Seven-day offline validity is independent of the fixed 365-day receipt retention.
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - { name: issueID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinLocale' } }
        - $ref: '#/components/parameters/BulletinSeries'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReaderAccessInput' } } }
      responses:
        '200':
          description: Committed receipt and source-free content; verify exact response bytes before decoding or persisting
          headers:
            X-HHC-Content-SHA256: { description: Lowercase SHA-256 of exact UTF-8 response body bytes, schema: { $ref: '#/components/schemas/OnlineBulletinHash' } }
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReaderAccessEnvelope' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/ReaderUnavailable' }
        '409': { description: 'Request, receipt or revision conflict; retry with a new clientRequestId and valid revision', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /member/bulletins/{issueID}/versions/{locale}/online/reader/state:
    get:
      operationId: getBulletinReaderState
      summary: Read and migrate the authorized account's private reader state
      description: Rechecks the exact PDF entitlement before lookup. Migrates through retained published checkpoints only; draft saves do not count. Optional direct sentence mappings are bounded to 8 MiB, not by transition count. Missing or corrupt history returns mapping_history_unavailable without modifying private data. No account ID is accepted from the client.
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - { name: issueID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinLocale' } }
        - { name: series, in: query, required: true, schema: { $ref: '#/components/schemas/BulletinSeries' } }
        - { name: fromRevision, in: query, schema: { type: integer, minimum: 1, maximum: 9007199254740991 } }
      responses:
        '200': { description: Account-scoped state and optional direct mappings, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderStateEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/ReaderUnavailable' }
        '409': { description: mapping_history_unavailable; retain local changes, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /member/bulletins/{issueID}/versions/{locale}/online/reader/mutations:
    post:
      operationId: mutateBulletinReader
      summary: Apply an ordered private reader mutation batch
      description: Same download entitlement and current publication are required even for replay. Maximum body 1 MiB, 100 operations, 500 anchors per action/note, and 10000 Unicode code points per note. Validation/persistence failure rolls back the whole batch. Terminal results and canonical payload fingerprints are retained for 91 days. Unseen operations older than 90 days return recovery_required. revision_changed is nonterminal and retains the mutation ID for mapped retry. Reusing a terminal ID with a different payload returns mutation_id_conflict. Client creation time is not authorization; values more than five minutes ahead of the server are rejected.
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: 'private, no-store'
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - { name: issueID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinLocale' } }
        - { name: series, in: query, required: true, schema: { $ref: '#/components/schemas/BulletinSeries' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mutations]
              properties:
                mutations: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ReaderMutation' } }
      responses:
        '200': { description: Ordered results and current account state, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderMutationEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '404': { $ref: '#/components/responses/ReaderUnavailable' }
        '409': { description: mutation_id_conflict or mapping_history_unavailable; retain local changes, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '413': { description: request_too_large; no operations applied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { $ref: '#/components/responses/Error' }
