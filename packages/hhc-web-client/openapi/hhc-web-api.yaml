    RecordingPublishEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RecordingPublishResult' }
        meta: { type: object, additionalProperties: true }
        error: { type: ['null'] }
    DSRRestrictionReference:
      type: object
      additionalProperties: false
      required:
      - userId
      - originalRequestId
      properties:
        userId:
          type: string
          format: uuid
        originalRequestId:
          type: string
          format: uuid
    DSRRestrictionWithdrawal:
      type: object
      additionalProperties: false
      required:
      - requestId
      - userId
      - originalRequestId
      - expectedState
      - idempotencyKey
      properties:
        requestId:
          type: string
          format: uuid
          description: Independent withdrawal request; must differ from the original restriction
            request.
        userId:
          type: string
          format: uuid
        originalRequestId:
          type: string
          format: uuid
        expectedState:
          type: string
          pattern: ^[a-f0-9]{64}$
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
    DSRRestrictionPreview:
      type: object
      additionalProperties: false
      required:
      - canWithdraw
      - activeRestrictions
      - fencePresent
      - stateToken
      - reasonCodes
      properties:
        canWithdraw:
          type: boolean
        activeRestrictions:
          type: integer
          format: int64
          minimum: 0
        fencePresent:
          type: boolean
        stateToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        reasonCodes:
          type: array
          items:
            type: string
            enum:
            - restriction_fence_absent
            - restriction_origin_unverified
            - subject_cleanup_recorded
            - original_restriction_unavailable
    DSRRestrictionWithdrawalResult:
      type: object
      additionalProperties: false
      required:
      - withdrawn
      - fenceCleared
      - remainingRestrictions
      properties:
        withdrawn:
          type: boolean
        fenceCleared:
          type: boolean
          description: Fence cleared at this receipt's transaction time; not a current-state
            claim on later replay.
        remainingRestrictions:
          type: integer
          format: int64
          minimum: 0
