        - $ref: '#/components/parameters/BulletinLocale'
        - { name: locales, in: query, description: 'One to three distinct comma-separated languages, mutually exclusive with locale.', schema: { type: string, pattern: '^(zh-Hant|zh-Hans|en)(,(zh-Hant|zh-Hans|en)){0,2}$' } }
