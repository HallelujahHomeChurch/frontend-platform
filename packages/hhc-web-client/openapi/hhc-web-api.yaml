          - reasonCodes
          properties:
            owner:
              type: string
              const: website_watermark
            action:
              type: string
              enum:
              - erase
              - restrict_processing
            status:
              type: string
              enum: [pending, completed]
            recordCount: *id005
            remainingCount: *id005
            coveredDatasets:
              $ref: '#/components/schemas/ReaderDSRCoverage'
            reasonCodes:
              type: array
              items: *id002
        meta:
          type: object
        error:
          type:
          - object
          - 'null'
