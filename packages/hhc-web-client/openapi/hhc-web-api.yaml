        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 180 }
      responses:
        '200': { description: Updated title, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/exposure:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: setAdminRecordingExposure
      summary: Retired recording exposure operation
      deprecated: true
      description: Pinning and hiding were removed. Authorized callers receive 410; use unpublish to return a published recording to draft.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-required-scopes: [cms:recordings:publish]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [featured, hidden]
              properties: { featured: { type: boolean }, hidden: { type: boolean } }
      responses:
        '410': {description: Pinning and hiding are retired.}
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
  /admin/recordings/{id}/publish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: publishAdminRecording
      summary: Publish only an owner-matched, media-validated ready primary version
      description: >-
        A service actor must supply Idempotency-Key. Human callers without it
        retain the RecordingEnvelope response. With a key, publication, its
        immutable receipt, audit and first-publication notification share one
        transaction. Replay returns the original receipt and current recording;
        outcome state_changed never republishes, including after manual
        unpublish or expiry. Reusing an actor-scoped key for a different recording
        or If-Match returns 409. A new intent requires a new key; never retry 412
        automatically with the latest version.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-required-scopes: [cms:recordings:publish]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for service actors; optional for human Admin compatibility. Exactly one value.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Original publication receipt and current state with a key; legacy RecordingEnvelope without a key.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/RecordingPublishEnvelope' }
                  - { $ref: '#/components/schemas/RecordingEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/unpublish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: unpublishAdminRecording
      summary: Stop new playback grants without deleting retained bytes
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-required-scopes: [cms:recordings:publish]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: Unpublished recording, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingEnvelope' } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/covers:
    get:
      operationId: listRecordingCovers
      summary: List owner-bound cover candidates and current selection
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:read]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cover status and selection, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingCoverListEnvelope' } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/cover-uploads:
    post:
      operationId: uploadRecordingCover
      summary: Upload bounded custom JPEG or PNG; never publishes
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:write]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9._:-]{1,128}$' } }
      requestBody:
        required: true
        description: At most 5 MiB, 24 MP and 8192 pixels per edge; backend validates and re-encodes. Published recordings additionally require cms:recordings:publish.
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
      responses:
        '202': { description: Accepted; processing is not selection, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingCoverUploadEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/cover:
    put:
      operationId: setRecordingCover
      summary: Select ready owner-bound cover with optimistic concurrency
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:write]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
        - { name: Idempotency-Key, in: header, schema: { type: string, pattern: '^[a-zA-Z0-9._:-]{1,128}$' }, description: 'Required for service actors and CLI; replay returns immutable receipt plus current state, never reapplies.' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordingCoverSelection' } } }
      responses:
        '200': { description: Selected or historical state changed; never publishes or extends expiry, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingCoverSelectionEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/recordings/{id}/covers/{coverId}/content:
    get:
      operationId: getRecordingCoverContent
      summary: Stream administrator preview without a playback grant
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:read]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }, { daprApiToken: [], daprCallerAppId: [], trustedPrincipalId: [], trustedPrincipalType: [], trustedClientId: [], trustedCredentialId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: coverId, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9-]{1,128}$' } }
      responses:
        '200': { description: Bounded private JPEG with nosniff, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /member/recordings/{id}/cover:
    get:
      operationId: getMemberRecordingCover
      summary: Stream current cover before playback after membership, legal and visibility checks
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-entitlements: [video.meeting-recordings.access]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Bounded private current JPEG without playback session or bearer URL, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    daprApiToken:
      type: apiKey
      in: header
      name: dapr-api-token
      description: Dapr API token supplied by api-gateway; the value is never published in this contract.
    daprCallerAppId:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Must identify the configured api-gateway Dapr application.
    trustedUserId:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Sanitized Account user identifier injected by api-gateway.
    trustedAuthProvider:
      type: apiKey
      in: header
      name: X-HHC-Auth-Provider
      description: Must be account-api.
    trustedPrincipalId:
      type: apiKey
      in: header
      name: X-HHC-Principal-ID
      description: Sanitized service principal UUID injected by api-gateway; never accepted directly from clients.
    trustedPrincipalType:
      type: apiKey
      in: header
      name: X-HHC-Principal-Type
      description: Must be service for the service-principal security alternative. Human identity retains trustedUserId.
    trustedClientId:
      type: apiKey
      in: header
      name: X-HHC-Client-ID
      description: Sanitized Account client identifier injected by api-gateway.
    trustedCredentialId:
      type: apiKey
      in: header
      name: X-HHC-Credential-ID
      description: Sanitized service credential UUID injected by api-gateway; this is an identifier, never a secret.
    trustedScopes:
      type: apiKey
      in: header
      name: X-HHC-Scopes
      description: Sanitized Account scopes injected by api-gateway and enforced per operation.
  parameters:
    ContentLocale: { name: locale, in: query, schema: { $ref: '#/components/schemas/ContentLocale' } }
    BulletinLocale: { name: locale, in: query, schema: { $ref: '#/components/schemas/BulletinLocale' } }
    BulletinSeries: { name: series, in: query, schema: { $ref: '#/components/schemas/BulletinSeries', default: general } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    PerPage: { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    SearchQuery:
      name: q
      in: query
      description: Searches the internal campaign name and localized subject or body.
      schema: { type: string, maxLength: 120 }
    IssueID: { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Conditional validator; weak validators and comma-separated lists are accepted.
      schema: { type: string }
    ContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/ContentModule' } }
    PublicationContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/PublicationContentModule' } }
    CreatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/CreatableContentModule' } }
    TranslatableContentModule: { name: module, in: path, required: true, schema: { $ref: '#/components/schemas/TranslatableContentModule' } }
    PageKey: { name: pageKey, in: path, required: true, schema: { type: string, enum: [home, about, privacy-policy, terms-of-use] } }
    ContentID: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
    ContentTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/ContentTranslationTargetLocale' } }
    BulletinTranslationTargetEdition: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/BulletinTranslationTargetEdition' } }
    CampaignTranslationTargetLocale: { name: targetLocale, in: path, required: true, schema: { $ref: '#/components/schemas/CampaignTranslationTargetLocale' } }
    Revision: { name: revision, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  requestBodies:
    PublicationInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicationInput' }
    ContentWriteInput:
      required: true
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ContentWriteInput'
              - $ref: '#/components/schemas/HomePageWriteInputV2'
    TranslationPreviewInput:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TranslationPreviewInput' }
  responses:
    ReaderUnavailable:
      description: Generic not_found for denied, missing or unpublished edition. Only this owner marker together with typed not_found is terminal; an unrelated router or gateway 404 must not purge offline data.
      headers:
        X-HHC-Bulletin-Access: { schema: { type: string, const: unavailable } }
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Health:
      description: Service process is healthy or ready.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, error]
            properties:
              data:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [healthy, ready] }
              meta: { type: object }
              error: { type: 'null' }
    BulletinIssue:
      description: Bulletin issue
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinIssueEnvelope' }
    ProtectedBulletin:
      description: Published bulletin metadata returned only after exact entitlement authorization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProtectedBulletinEnvelope' }
    ProtectedBulletinNotFound:
      description: Bulletin, entitlement, or protected asset is absent; the response does not disclose which condition failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BulletinDownloadJob:
      description: Current durable bulletin preparation state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinDownloadJobEnvelope' }
    BulletinDownloadJobPending:
      description: Bulletin preparation is queued or running.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinDownloadJobEnvelope' }
    Error:
      description: Standard API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthorized:
      description: Trusted gateway identity is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: The trusted Account identity lacks a required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Campaign:
      description: Engagement-owned campaign response forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignEnvelope' }
    CampaignPage:
      description: Engagement-owned campaign page forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignPageEnvelope' }
    CampaignDeliveryPage:
      description: Engagement-owned campaign delivery page forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignDeliveryPageEnvelope' }
    NotificationSummaryPage:
      description: Engagement-owned logical notification page forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationSummaryPageEnvelope' }
    CampaignSchedule:
      description: Engagement-owned campaign schedule forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignScheduleEnvelope' }
    CampaignScheduleList:
      description: Engagement-owned campaign schedule list forwarded unchanged.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignScheduleListEnvelope' }
    EngagementError:
      description: Engagement API rejected or could not complete the proxied request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EngagementErrorEnvelope' }
    EngagementUnavailable:
      description: Engagement API is unavailable locally or reports that it is not ready.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EngagementUnavailableEnvelope' }
    ContentItem:
      description: Typed content item
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContentItemEnvelope' }
    PublicContentList:
      description: Published localized content
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicContentListEnvelope' }
    PublicContentItem:
      description: Published localized content item
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicContentItemEnvelope' }
    PublicLocationList:
      description: Published locations for the exact requested locale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicLocationListEnvelope' }
    PublicEditorialPage:
      description: Published fixed editorial page for the exact requested locale.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'public, max-age=30, must-revalidate' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicEditorialPageEnvelope' }
    PublicEditorialPageNotModified:
      description: The fixed editorial page has not changed.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'public, max-age=30, must-revalidate' } }
    SiteLayout:
      description: Published Site Layout for the exact requested locale.
      headers:
        ETag: { $ref: '#/components/headers/SiteLayoutETag' }
        Cache-Control: { $ref: '#/components/headers/SiteLayoutCacheControl' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteLayoutEnvelope' }
    SiteLayoutNotModified:
      description: Site Layout has not changed.
      headers:
        ETag: { $ref: '#/components/headers/SiteLayoutETag' }
        Cache-Control: { $ref: '#/components/headers/SiteLayoutCacheControl' }
    SiteSettings:
      description: Site Settings aggregate.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteSettingsEnvelope' }
    SiteSettingsRevisionList:
      description: Site Settings revision list.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SiteSettingsRevisionListEnvelope' }
    ContentTranslationPreview:
      description: Review-only generated translation preview; no CMS state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContentTranslationPreviewEnvelope' }
    BulletinTranslationPreview:
      description: Review-only generated bulletin edition preview; no CMS state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BulletinTranslationPreviewEnvelope' }
    CampaignTranslationPreview:
      description: Review-only generated campaign translation preview; no campaign or schedule state is changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampaignTranslationPreviewEnvelope' }
    InvalidTranslationRequest:
      description: invalid_translation_request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationNotFound:
      description: not_found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationExists:
      description: translation_exists
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationVersionMismatch:
      description: version_mismatch
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationRateLimited:
      description: translation_rate_limited
      headers:
        Retry-After:
          description: Integer seconds until the caller may retry this translation target.
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationContentFiltered:
      description: translation_content_filtered
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationProviderError:
      description: translation_provider_error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationDisabled:
      description: translation_disabled
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TranslationTimeout:
      description: translation_timeout
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  headers:
    SiteLayoutETag:
      description: Strong validator derived from the published aggregate version.
      schema: { type: string, pattern: '^"site-layout-[1-9][0-9]*"$' }
    SiteLayoutCacheControl:
      description: Public revalidation policy for Site Layout projections.
      schema: { type: string, const: 'public, max-age=30, must-revalidate' }
  schemas:
    ReaderSentence:
      description: Dynamic sentence anchor. The canonical- ID prefix is reserved for shared canonical metadata anchors across layouts.
      type: object
      additionalProperties: false
      required: [id, spans]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        spans:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/OnlineBulletinSpan' }
    ReaderBlock:
      type: object
      additionalProperties: false
      required: [id, style, sentences]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
        sentences:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/ReaderSentence' }
    ReaderItem:
      type: object
      additionalProperties: false
      required: [id, blocks]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        title: { $ref: '#/components/schemas/ReaderBlock' }
        blocks:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderCover:
      type: object
      additionalProperties: false
      required: [welcome, worship, work, wordQuestions, weeklyVerses]
      properties:
        welcome:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
        worship:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        work:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        wordQuestions:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
        weeklyVerses:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderBodySection:
      type: object
      additionalProperties: false
      required: [kind, title, blocks]
      properties:
        kind: { type: string, enum: [sermon, testimony, teaching, reflection, unknown], description: Unknown creates a blocking review issue. }
        header: { $ref: '#/components/schemas/ReaderBodyHeader' }
        title: { $ref: '#/components/schemas/ReaderBlock' }
        subtitle: { $ref: '#/components/schemas/ReaderBlock' }
        contributors:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor, author] }
              name: { $ref: '#/components/schemas/ReaderBlock' }
        blocks:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderBodyHeader:
      description: First body section only. Source lecture date is independent of canonical issue publication date; all fields use sentence anchors. Missing contributor roles block publication review.
      type: object
      additionalProperties: false
      required: [lectureDate, contributors]
      properties:
        lectureDate: { $ref: '#/components/schemas/ReaderBlock' }
        contributors:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor] }
              name: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderHymnLyrics:
      type: object
      additionalProperties: false
      required: [hymns]
      properties:
        hymns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, title, sections]
            properties:
              id: { $ref: '#/components/schemas/OnlineBulletinID' }
              number: { $ref: '#/components/schemas/ReaderBlock' }
              title: { $ref: '#/components/schemas/ReaderBlock' }
              sourceLabel: { $ref: '#/components/schemas/ReaderBlock' }
              sections:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  required: [id, kind, lines]
                  properties:
                    id: { $ref: '#/components/schemas/OnlineBulletinID' }
                    kind: { type: string, enum: [verse, chorus, bridge] }
                    lines:
                      type: array
                      minItems: 1
                      maxItems: 4096
                      items: { $ref: '#/components/schemas/ReaderBlock' }
    ReaderComponent:
      oneOf:
        - $ref: '#/components/schemas/ReaderCoverComponent'
        - $ref: '#/components/schemas/ReaderBodyComponent'
        - $ref: '#/components/schemas/ReaderHymnComponent'
        - $ref: '#/components/schemas/ReaderBackComponent'
      discriminator:
        propertyName: type
        mapping:
          cover: '#/components/schemas/ReaderCoverComponent'
          bodySection: '#/components/schemas/ReaderBodyComponent'
          hymnLyrics: '#/components/schemas/ReaderHymnComponent'
          backSummary: '#/components/schemas/ReaderBackComponent'
          announcements: '#/components/schemas/ReaderBackComponent'
          victoriesAndPrayers: '#/components/schemas/ReaderBackComponent'
    ReaderCoverComponent:
      type: object
      additionalProperties: false
      required: [id, type, cover]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: cover }
        cover: { $ref: '#/components/schemas/ReaderCover' }
    ReaderBodyComponent:
      type: object
      additionalProperties: false
      required: [id, type, bodySection]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: bodySection }
        bodySection: { $ref: '#/components/schemas/ReaderBodySection' }
    ReaderHymnComponent:
      type: object
      additionalProperties: false
      required: [id, type, hymnLyrics]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: hymnLyrics }
        hymnLyrics: { $ref: '#/components/schemas/ReaderHymnLyrics' }
    ReaderBackComponent:
      type: object
      additionalProperties: false
      required: [id, type, items]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, enum: [backSummary, announcements, victoriesAndPrayers] }
        items:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/ReaderItem' }
    ReaderHighlightColor:
      type: string
      enum: [yellow, red, blue]
    ReaderAnchorIDs:
      type: array
      minItems: 1
      maxItems: 500
      uniqueItems: true
      items: { $ref: '#/components/schemas/OnlineBulletinID' }
    ReaderTextRange:
      type: object
      additionalProperties: false
      required: [sentenceId, start, end]
      description: Half-open Unicode scalar offsets into the trusted published sentence; start must be less than end. DOM UTF-16 offsets are not accepted.
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0, maximum: 1000000 }
        end: { type: integer, minimum: 1, maximum: 1000000 }
    ReaderTextRanges:
      type: array
      minItems: 1
      maxItems: 500
      description: One continuous range in semantic order; exactly one entry for each sentenceIds item. Omit for legacy whole-sentence behavior; null and empty are invalid.
      items: { $ref: '#/components/schemas/ReaderTextRange' }
    ReaderHighlightSegment:
      type: object
      additionalProperties: false
      required: [start, end, color]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        color: { $ref: '#/components/schemas/ReaderHighlightColor' }
    ReaderNoteRange:
      type: object
      additionalProperties: false
      required: [sentenceId, start, end, quote]
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }
        quote: { type: string, description: Complete server-derived source sentence used to verify offsets on revision migration. The parent note quote contains only selected text. }
    ReaderPrivateAnchor:
      type: object
      additionalProperties: false
      required: [sentenceId, quote, componentId, pageId]
      properties:
        sentenceId: { type: string }
        quote: { type: string }
        componentId: { type: string }
        pageId: { type: string }
    ReaderHighlight:
      type: object
      additionalProperties: false
      required: [sentenceId, color, quote, active, version, updatedAt]
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 256
          description: Authoritative sorted non-overlapping ranges. When omitted, legacy color covers the complete sentence. When present, top-level color is only the first segment color.
          items: { $ref: '#/components/schemas/ReaderHighlightSegment' }
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        color: { $ref: '#/components/schemas/ReaderHighlightColor' }
        quote: { type: string }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ReaderNote:
      type: object
      additionalProperties: false
      required: [id, text, sentenceIds, inactiveAnchors, quote, version, deleted, reanchorRequired, createdAt, updatedAt]
      properties:
        ranges:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/ReaderNoteRange' }
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 10000 }
        sentenceIds: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/OnlineBulletinID' } }
        inactiveAnchors: { type: array, items: { $ref: '#/components/schemas/ReaderPrivateAnchor' } }
        quote: { type: string }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        reanchorRequired: { type: boolean, description: Oversized automatic split retains private text/quote without truncation; explicit re-anchoring is required. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReaderProgress:
      type: object
      additionalProperties: false
      required: [pageId, componentId, sentenceId, recordedAt, updatedAt]
      properties:
        pageId: { type: string }
        componentId: { type: string }
        sentenceId: { type: string }
        recordedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReaderMigrationConflict:
      type: object
      additionalProperties: false
      required: [id, sentenceIds, sources]
      properties:
        id: { type: string, format: uuid }
        sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
        sources: { type: array, items: { $ref: '#/components/schemas/ReaderHighlight' } }
    ReaderPrivateState:
      type: object
      additionalProperties: false
      required: [accountId, documentId, appliedRevision, currentRevision, highlights, notes, progress, conflicts]
      properties:
        accountId: { type: string, format: uuid, readOnly: true, description: Trusted response binding only; never accepted as a mutation input. }
        documentId: { type: string, format: uuid }
        appliedRevision: { type: integer, minimum: 1 }
        currentRevision: { type: integer, minimum: 1 }
        highlights: { type: array, items: { $ref: '#/components/schemas/ReaderHighlight' } }
        notes: { type: array, items: { $ref: '#/components/schemas/ReaderNote' } }
        progress: { oneOf: [{ $ref: '#/components/schemas/ReaderProgress' }, { type: 'null' }] }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ReaderMigrationConflict' } }
    ReaderStateEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { $ref: '#/components/schemas/ReaderPrivateState' }
            fromRevision: { type: integer, minimum: 1 }
            mappings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [fromSentenceId, toSentenceIds]
                properties:
                  fromSentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
                  toSentenceIds: { type: array, items: { $ref: '#/components/schemas/OnlineBulletinID' } }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderMutationResult:
      type: object
      additionalProperties: false
      required: [mutationId, status, revision]
      properties:
        mutationId: { type: string, format: uuid }
        status: { type: string, enum: [applied, revision_changed, recovery_required, note_conflict, migration_conflict, conflict_not_found] }
        revision: { type: integer, minimum: 1 }
        note: { $ref: '#/components/schemas/ReaderNote' }
    ReaderMutationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state, results]
          properties:
            state: { $ref: '#/components/schemas/ReaderPrivateState' }
            results: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReaderMutationResult' } }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderMutation:
      allOf:
        - type: object
          additionalProperties: false
          required: [mutationId, createdAt, documentRevision, kind, payload]
          properties:
            mutationId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            documentRevision: { type: integer, minimum: 1, maximum: 9007199254740991 }
            baseVersion: { type: integer, minimum: 1 }
            kind: { type: string, enum: [setHighlight, clearHighlight, createNote, editNote, deleteNote, setProgress, resolveHighlightMigrationConflict] }
            payload: { type: object, additionalProperties: true }
        - oneOf:
            - required: [kind, payload]
              properties:
                kind: { const: setHighlight }
                payload:
                  type: object
                  additionalProperties: false
                  required: [sentenceIds, color]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    color: { $ref: '#/components/schemas/ReaderHighlightColor' }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: clearHighlight }
                payload:
                  type: object
                  additionalProperties: false
                  required: [sentenceIds]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: createNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId, sentenceIds, text]
                  properties:
                    ranges: { $ref: '#/components/schemas/ReaderTextRanges' }
                    noteId: { type: string, format: uuid }
                    sentenceIds: { $ref: '#/components/schemas/ReaderAnchorIDs' }
                    text: { type: string, minLength: 1, maxLength: 10000 }
              not: { required: [baseVersion] }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: editNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId, text]
                  properties:
                    noteId: { type: string, format: uuid }
                    text: { type: string, minLength: 1, maxLength: 10000 }
            - required: [kind, payload, baseVersion]
              properties:
                kind: { const: deleteNote }
                payload:
                  type: object
                  additionalProperties: false
                  required: [noteId]
                  properties:
                    noteId: { type: string, format: uuid }
            - required: [kind, payload]
              properties:
                kind: { const: setProgress }
                payload:
                  type: object
                  additionalProperties: false
                  properties:
                    pageId: { type: string, maxLength: 128 }
                    componentId: { type: string, maxLength: 128 }
                    sentenceId: { type: string, maxLength: 128 }
              not: { required: [baseVersion] }
            - required: [kind, payload]
              properties:
                kind: { const: resolveHighlightMigrationConflict }
                payload:
                  type: object
                  additionalProperties: false
                  required: [conflictId, chosenColor, currentRevision]
                  properties:
                    conflictId: { type: string, format: uuid }
                    chosenColor: { $ref: '#/components/schemas/ReaderHighlightColor' }
                    currentRevision: { type: integer, minimum: 1, maximum: 9007199254740991 }
              not: { required: [baseVersion] }
    ReaderAccessInput:
      description: At most 4096 encoded bytes. Each client request UUID is account-bound and immutable for the receipt retention period.
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        receiptId: { type: string, format: uuid }
    ReaderPDFAction:
      description: Current PDF action identity, never a private asset URL.
      type: object
      additionalProperties: false
      required: [issueId, series, locale]
      properties:
        issueId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        locale: { $ref: '#/components/schemas/BulletinLocale' }
    ReaderReceiptExport:
      type: object
      additionalProperties: false
      required: [receiptId, accountId, documentId, issueId, series, contentLocale, revision, channel, privacyNoticeVersion, issuedAt, expiresAt]
      properties:
        receiptId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        issueId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        revision: { type: integer, minimum: 1 }
        channel: { type: string, const: online_reader }
        privacyNoticeVersion: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReaderValidationExport:
      type: object
      additionalProperties: false
      required: [clientRequestId, accountId, receiptId, requestHash, validatedAt, offlineValidUntil]
      properties:
        clientRequestId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        requestHash: { $ref: '#/components/schemas/OnlineBulletinHash' }
        validatedAt: { type: string, format: date-time }
        offlineValidUntil: { type: string, format: date-time }
    ReaderDiscoveryItem:
      type: object
      additionalProperties: false
      required: [issueId, issueNumber, issueDate, series, contentLocale, canonicalMetadata, onlineRevision, pdfPublished]
      properties:
        issueId: { type: string, format: uuid }
        issueNumber: { type: [integer, 'null'], description: 'Current canonical route identity, independent of the frozen publication metadata.' }
        issueDate: { type: string, format: date }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        documentId: { type: string, format: uuid }
        onlineRevision: { type: [integer, 'null'], minimum: 1 }
        pdfPublished: { type: boolean }
        download: { $ref: '#/components/schemas/ReaderPDFAction' }
    ReaderDiscoveryEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, total, offset, limit]
          properties:
            items: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/ReaderDiscoveryItem' } }
            total: { type: integer, minimum: 0 }
            offset: { type: integer, minimum: 0, maximum: 1000000 }
            limit: { type: integer, minimum: 1, maximum: 100 }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderAccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [document, access]
          properties:
            document: { $ref: '#/components/schemas/ReaderDocument' }
            access: { $ref: '#/components/schemas/ReaderAccess' }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    ReaderAccess:
      type: object
      additionalProperties: false
      required: [accountId, documentId, series, contentLocale, revision, currentRevision, receiptId, traceCode, validatedAt, offlineValidUntil]
      properties:
        accountId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        revision: { type: integer, minimum: 1 }
        currentRevision: { type: integer, minimum: 1 }
        receiptId: { type: string, format: uuid }
        traceCode: { type: string, description: Opaque formatted visible code; never account identity. }
        validatedAt: { type: string, format: date-time }
        offlineValidUntil: { type: string, format: date-time, description: Exactly 604800 seconds after validatedAt. }
    ReaderDocument:
      type: object
      additionalProperties: false
      required: [issueId, documentId, series, contentLocale, revision, canonicalMetadata, metadataSyncPending, pdfPublished, content]
      properties:
        issueId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        series: { $ref: '#/components/schemas/BulletinSeries' }
        contentLocale: { $ref: '#/components/schemas/BulletinLocale' }
        revision: { type: integer, minimum: 1 }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        metadataSyncPending: { type: boolean }
        pdfPublished: { type: boolean }
        download: { $ref: '#/components/schemas/ReaderPDFAction' }
        content: { $ref: '#/components/schemas/ReaderContent' }
    ReaderContent:
      description: Closed published rendering projection with no extraction provenance. Layout proof binds the original worker measurement; it is not a hash of this redacted DTO. Verify the response byte digest separately.
      type: object
      additionalProperties: false
      required: [schemaVersion, templateVersion, printedBodyPageCount, pages, layoutManifest, components]
      properties:
        printedBodyPageCount: { type: integer, minimum: 2, maximum: 38, description: 'Visible printed body issue-summary count, independent of HTML pagination.' }
        schemaVersion: { type: string, const: '1' }
        templateVersion: { type: string, enum: [v1, v2] }
        pages: { type: array, minItems: 4, maxItems: 40, items: { $ref: '#/components/schemas/OnlineBulletinPage' } }
        layoutManifest: { $ref: '#/components/schemas/OnlineBulletinLayoutManifest' }
        components: { type: array, minItems: 6, maxItems: 256, items: { $ref: '#/components/schemas/ReaderComponent' } }
    OnlineBulletinComparisonValue:
      oneOf:
        - { $ref: '#/components/schemas/OnlineBulletinBlock' }
        - { $ref: '#/components/schemas/OnlineBulletinComponent' }
        - type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinID' }
        - { type: 'null' }
    OnlineBulletinComparison:
      type: object
      additionalProperties: false
      required: [documentId, version, canonicalVersion, baseRevision, localRevision, incomingRevision, units]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        baseRevision: { type: integer, format: int64, minimum: 1 }
        localRevision: { type: integer, format: int64, minimum: 1 }
        incomingRevision: { type: integer, format: int64, minimum: 1 }
        units:
          type: array
          maxItems: 65536
          items:
            type: object
            additionalProperties: false
            required: [componentId, blockId, suggestion, base, local, incoming]
            properties:
              componentId: { type: string, maxLength: 128 }
              blockId: { type: string, maxLength: 128 }
              suggestion: { type: string, enum: [same, local, incoming, conflict] }
              base: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
              local: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
              incoming: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
    OnlineBulletinCompareInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, baseRevision, localRevision, incomingRevision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        baseRevision: { type: integer, format: int64, minimum: 1 }
        localRevision: { type: integer, format: int64, minimum: 1 }
        incomingRevision: { type: integer, format: int64, minimum: 1 }
        choices:
          type: array
          maxItems: 65536
          items:
            type: object
            additionalProperties: false
            required: [componentId, blockId, choice]
            properties:
              componentId: { type: string, maxLength: 128 }
              blockId: { type: string, maxLength: 128 }
              choice: { type: string, enum: [local, incoming, manual] }
              value: { $ref: '#/components/schemas/OnlineBulletinComparisonValue' }
            oneOf:
              - properties:
                  choice: { const: manual }
                required: [value]
              - properties:
                  choice: { enum: [local, incoming] }
                not:
                  properties:
                    value: {}
                  required: [value]
    OnlineBulletinDraftInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, components]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        components:
          description: Typed editable content only. Omit every read-only sentence source field; the server preserves source provenance by stable sentence ID.
          type: array
          minItems: 6
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinComponent' }
    OnlineBulletinSavedDraft:
      type: object
      additionalProperties: false
      required: [documentId, version, revision, layoutJobId]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        layoutJobId: { type: string, format: uuid }
    OnlineBulletinExtractionInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        retry: { type: boolean, default: false }
    OnlineBulletinQueuedExtractionEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [documentId, version, job]
          properties:
            documentId: { type: string, format: uuid }
            version: { type: integer, format: int64, minimum: 1 }
            job: { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        meta: { type: object, additionalProperties: true }
        error: { type: 'null' }
    OnlineBulletinRevisionPage:
      type: object
      additionalProperties: false
      required: [documentId, items, nextBefore]
      properties:
        documentId: { type: string, format: uuid }
        nextBefore: { type: [integer, 'null'], format: int64, minimum: 1 }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [revision, createdBy, createdAt, sourceAssetChecksum, layoutValidated]
            properties:
              revision: { type: integer, format: int64, minimum: 1 }
              createdBy: { type: string }
              createdAt: { type: string, format: date-time }
              sourceAssetChecksum: { type: string, pattern: '^[0-9a-f]{64}$' }
              layoutValidated: { type: boolean, description: Historical worker proof exists; not current publication authority. }
    OnlineBulletinHistoricalRevision:
      type: object
      additionalProperties: false
      required: [documentId, revision, document, reviewIssues, canonicalMetadata, createdBy, createdAt]
      properties:
        documentId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        document: { $ref: '#/components/schemas/OnlineBulletinDocument' }
        reviewIssues:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    OnlineBulletinPublishInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, revision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        mappings:
          type: array
          maxItems: 65536
          items: { $ref: '#/components/schemas/OnlineBulletinSentenceMapping' }
    OnlineBulletinSentenceMapping:
      type: object
      additionalProperties: false
      required: [fromSentenceId, status, toSentenceIds]
      properties:
        fromSentenceId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        status: { type: string, enum: [unchanged, moved, split, merged, removed] }
        toSentenceIds:
          type: array
          maxItems: 1024
          uniqueItems: true
          items: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    OnlineBulletinUnpublishedRevision:
      type: object
      additionalProperties: false
      required: [documentId, version]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinRestoreInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinConfirmInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, revision, layoutValidationHash, pageCount, acceptedIssues]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        layoutValidationHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        pageCount: { type: integer, minimum: 1, maximum: 80 }
        acceptedIssues:
          type: array
          maxItems: 4096
          uniqueItems: true
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinConfirmedRevision:
      type: object
      additionalProperties: false
      required: [documentId, version, revision]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
    OnlineBulletinDerivation:
      type: object
      additionalProperties: false
      description: Latest non-superseded conversion provenance; Admin only. A resultRevision may be Incoming rather than the adopted Local baseline. stale compares the current source revision, hash and canonical metadata.
      required: [sourceDocumentId, sourceRevision, sourceContentHash, sourceMetadataVersion, converterVersion, resultRevision, convertedMetadata, stale]
      properties:
        sourceDocumentId: { type: string, format: uuid }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        sourceContentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceMetadataVersion: { type: integer, format: int64, minimum: 1 }
        converterVersion: { type: string }
        resultRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        convertedMetadata:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        stale: { type: boolean }
    OnlineBulletinConversionInput:
      type: object
      additionalProperties: false
      required: [canonicalVersion, sourceOnlineVersion, sourceRevision]
      properties:
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        sourceOnlineVersion: { type: integer, format: int64, minimum: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 1 }
        retry: { type: boolean, default: false }
    OnlineBulletinAdminState:
      type: object
      additionalProperties: false
      required: [issueId, series, contentLocale, canonicalVersion, canonicalMetadata, pdfStatus, documentId, version, draftStatus, baseRevision, local, incomingRevision, publishedRevision, publishedMetadata, metadataSyncPending, confirmed, extraction, layout]
      properties:
        issueId: { type: string, format: uuid }
        series: { type: string, enum: [general] }
        contentLocale: { type: string, enum: [zh-Hant, zh-Hans] }
        canonicalVersion: { type: integer, format: int64, minimum: 1 }
        canonicalMetadata: { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        pdfStatus: { $ref: '#/components/schemas/BulletinVersionStatus' }
        documentId: { type: string, pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$' }
        version: { type: integer, format: int64, minimum: 0 }
        draftStatus: { type: string, enum: [notStarted, extracting, reviewRequired, ready, published, extractionFailed] }
        baseRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        incomingRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        publishedRevision: { type: [integer, 'null'], format: int64, minimum: 1 }
        metadataSyncPending: { type: boolean, description: Canonical metadata differs from the immutable Online publication and requires explicit republish. }
        conversion: { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        derivation: { $ref: '#/components/schemas/OnlineBulletinDerivation' }
        confirmed: { type: boolean, description: Human confirmation matches current Local and canonical metadata. This does not itself authorize publication. }
        publishedMetadata:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinCanonicalMetadata' }
        local:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminRevision' }
        extraction:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
        layout:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/OnlineBulletinAdminJob' }
    OnlineBulletinAdminRevision:
      type: object
      additionalProperties: false
      required: [revision, document, reviewIssues]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        document: { $ref: '#/components/schemas/OnlineBulletinDocument' }
        reviewIssues:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinReviewIssue:
      type: object
      additionalProperties: false
      required: [code, blocking]
      properties:
        code: { type: string, pattern: '^[a-z0-9_]{1,64}$' }
        blocking: { type: boolean }
        componentId: { $ref: '#/components/schemas/OnlineBulletinID' }
    OnlineBulletinAdminJob:
      type: object
      additionalProperties: false
      required: [id, status, attempts, errorCode]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, parsing, converting, review_ready, validating, ready, failed] }
        attempts: { type: integer, minimum: 0 }
        errorCode: { type: string, pattern: '^[a-z0-9_]{0,64}$' }
        reviewIssues:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinReviewIssue' }
    OnlineBulletinID:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'
    OnlineBulletinHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
    OnlineBulletinFontRole:
      type: string
      enum: [body, scripture, emphasis, reference, foreignText, symbol]
    OnlineBulletinDocument:
      description: Typed immutable content. Canonical issue metadata and mutable source asset IDs are intentionally absent. Maximum encoded size is 8 MiB; server also validates references, total collection limits and fragment coverage.
      type: object
      additionalProperties: false
      required: [issueId, series, contentLocale, schemaVersion, templateVersion, sourceAssetChecksum, sourcePageCount, pages, layoutManifest, components]
      properties:
        issueId: { type: string, format: uuid }
        series: { type: string, const: general }
        contentLocale: { type: string, enum: [zh-Hant, zh-Hans] }
        schemaVersion: { type: string, const: '1' }
        templateVersion: { type: string, enum: [v1, v2] }
        sourceAssetChecksum: { $ref: '#/components/schemas/OnlineBulletinHash' }
        sourcePageCount: { type: integer, minimum: 4, maximum: 40, description: Must equal the saved page count. Composition preserves original page identity and fragment membership; overflow blocks publication instead of adding pages. }
        pages:
          type: array
          minItems: 4
          maxItems: 40
          items: { $ref: '#/components/schemas/OnlineBulletinPage' }
        layoutManifest: { $ref: '#/components/schemas/OnlineBulletinLayoutManifest' }
        components:
          type: array
          minItems: 6
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinComponent' }
    OnlineBulletinPage:
      type: object
      additionalProperties: false
      required: [id, width, height]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        width: { type: number, exclusiveMinimum: 0, maximum: 2000, description: PDF points. }
        height: { type: number, exclusiveMinimum: 0, maximum: 2000, description: PDF points. }
    OnlineBulletinBox:
      description: Normalized page-relative rectangle. Server additionally rejects any edge exceeding the page boundary.
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
    OnlineBulletinLayoutManifest:
      description: Revision-owned manifest; hashes bind the authoritative isolated-worker measurement. Empty validation hashes represent a pending draft, never permission to publish.
      type: object
      additionalProperties: false
      required: [templateVersion, rendererVersion, rendererArtifactSha256, assets, pages]
      properties:
        templateVersion: { type: string, enum: [v1, v2] }
        rendererVersion: { type: string, enum: [v1, v2] }
        rendererArtifactSha256: { $ref: '#/components/schemas/OnlineBulletinHash' }
        contentHash: { $ref: '#/components/schemas/OnlineBulletinHash' }
        layoutValidationHash: { $ref: '#/components/schemas/OnlineBulletinHash' }
        assets:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/OnlineBulletinAsset' }
        pages:
          type: array
          minItems: 4
          maxItems: 40
          items: { $ref: '#/components/schemas/OnlineBulletinLayoutPage' }
    OnlineBulletinAsset:
      description: Code-owned permanent self-hosted asset, never an executable URL. Filename includes its exact SHA-256.
      type: object
      additionalProperties: false
      required: [url, sha256, kind]
      properties:
        url: { type: string, pattern: '^/assets/weekly/v[12]/[a-zA-Z0-9_-]*[0-9a-f]{64}\.(woff2|png|svg|webp)$' }
        sha256: { $ref: '#/components/schemas/OnlineBulletinHash' }
        kind: { type: string, enum: [font, decoration] }
        fontRole: { $ref: '#/components/schemas/OnlineBulletinFontRole' }
    OnlineBulletinLayoutPage:
      type: object
      additionalProperties: false
      required: [pageId, slots]
      properties:
        pageId: { $ref: '#/components/schemas/OnlineBulletinID' }
        fixedSlots:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/OnlineBulletinFixedSlot' }
        slots:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/OnlineBulletinSlot' }
    OnlineBulletinSlot:
      type: object
      additionalProperties: false
      required: [id, componentId, blockId, box, fragments]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        componentId: { $ref: '#/components/schemas/OnlineBulletinID' }
        blockId: { $ref: '#/components/schemas/OnlineBulletinID' }
        box: { $ref: '#/components/schemas/OnlineBulletinBox' }
        continuationOf: { $ref: '#/components/schemas/OnlineBulletinID' }
        fragments:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/OnlineBulletinFragment' }
    OnlineBulletinFixedSlot:
      description: Template-owned geometry for a fixed label or canonical metadata reference. It contains no editable text or executable URL.
      type: object
      additionalProperties: false
      required: [id, element, box, style]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        element:
          type: string
          enum: [title, subtitle, date, issueNumber, pageNumber, masthead, vision, visionMission, visionFellowship, visionCommitment, pastor, contact, scanHint, websiteQRLabel, youtubeQRLabel, streamQRLabel, welcomeLabel, worshipLabel, workLabel, wordLabel, verseLabel, hymnLabel, summaryLabel, summarySidebarTitle, summarySidebarTagline, announcementsLabel, prayersLabel, titleLabel, speakerLabel, speakerSeparator, lectureDateMarker, bodyIssueSummary, bodySpeakerLabel, transcriberLabel, editorLabel, authorLabel, logo, backgroundLogo, websiteQR, youtubeQR, streamQR, topRule, footerRule, summaryFrame, announcementsFrame, prayersFrame]
        box: { $ref: '#/components/schemas/OnlineBulletinBox' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
    OnlineBulletinCanonicalMetadata:
      description: Read-only snapshot of existing CMS fields, separate from editable document content.
      type: object
      additionalProperties: false
      required: [title, subtitle, issueNumber, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        subtitle: { type: string, maxLength: 256 }
        issueNumber: { type: integer, minimum: 1 }
        date: { type: string, format: date }
    OnlineBulletinFragment:
      description: Half-open offsets in Unicode code points, not UTF-8 bytes or UTF-16 units. Coverage must be complete and non-overlapping in reading order.
      type: object
      additionalProperties: false
      required: [sentenceId, start, end]
      properties:
        sentenceId: { $ref: '#/components/schemas/OnlineBulletinID' }
        start: { type: integer, minimum: 0, maximum: 4095 }
        end: { type: integer, minimum: 1, maximum: 4096 }
    OnlineBulletinSpan:
      type: object
      additionalProperties: false
      required: [text, fontRole]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
        fontRole: { $ref: '#/components/schemas/OnlineBulletinFontRole' }
        fontSize: { type: [number, 'null'], minimum: 6, maximum: 96, description: Optional source PDF-point size for mixed-size inline runs. Missing or null inherits the block size; mobile retains the proportional em ratio. }
    OnlineBulletinSentence:
      description: Dynamic sentence anchor. The canonical- ID prefix is reserved for shared canonical metadata anchors across layouts.
      type: object
      additionalProperties: false
      required: [id, spans]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        spans:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/OnlineBulletinSpan' }
        source:
          readOnly: true
          description: Server-owned PDF provenance; forbidden in component edit requests.
          type: object
          additionalProperties: false
          required: [page, box]
          properties:
            page: { type: integer, minimum: 1, maximum: 40 }
            box: { $ref: '#/components/schemas/OnlineBulletinBox' }
    OnlineBulletinParagraphStyle:
      description: Font size and line height in PDF points. Indents and spacing in em units; negative first-line indentation supports hanging paragraphs.
      type: object
      additionalProperties: false
      required: [fontSize, lineHeight, indent, firstLineIndent, spaceBefore, spaceAfter]
      properties:
        fontSize: { type: number, minimum: 6, maximum: 96 }
        lineHeight: { type: number, minimum: 6, maximum: 192 }
        letterSpacing: { type: number, minimum: -0.5, maximum: 1, description: Explicit source tracking in em; omitted means zero. Never adjusted automatically to fit edits. }
        align: { type: string, enum: [left, center, right, justify] }
        indent: { type: number, minimum: 0, maximum: 20 }
        firstLineIndent: { type: number, minimum: -20, maximum: 20 }
        spaceBefore: { type: number, minimum: 0, maximum: 20 }
        spaceAfter: { type: number, minimum: 0, maximum: 20 }
    OnlineBulletinBlock:
      type: object
      additionalProperties: false
      required: [id, style, sentences]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        style: { $ref: '#/components/schemas/OnlineBulletinParagraphStyle' }
        sentences:
          type: array
          minItems: 1
          maxItems: 1024
          items: { $ref: '#/components/schemas/OnlineBulletinSentence' }
    OnlineBulletinItem:
      type: object
      additionalProperties: false
      required: [id, blocks]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        title: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        blocks:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
    OnlineBulletinCover:
      type: object
      additionalProperties: false
      required: [welcome, worship, work, wordQuestions, weeklyVerses]
      properties:
        welcome:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        worship:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        work:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        wordQuestions:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: '#/components/schemas/OnlineBulletinItem' }
        weeklyVerses:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
    OnlineBulletinBodySection:
      type: object
      additionalProperties: false
      required: [kind, title, blocks]
      properties:
        kind: { type: string, enum: [sermon, testimony, teaching, reflection, unknown], description: Unknown creates a blocking review issue. }
        header: { $ref: '#/components/schemas/OnlineBulletinBodyHeader' }
        title: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        subtitle: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        contributors:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor, author] }
              name: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        blocks:
          type: array
          minItems: 1
          maxItems: 4096
          items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
    OnlineBulletinBodyHeader:
      description: First body section only. Source lecture date is independent of canonical issue publication date; all fields use sentence anchors. Missing contributor roles block publication review.
      type: object
      additionalProperties: false
      required: [lectureDate, contributors]
      properties:
        lectureDate: { $ref: '#/components/schemas/OnlineBulletinBlock' }
        contributors:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [role, name]
            properties:
              role: { type: string, enum: [speaker, transcriber, editor] }
              name: { $ref: '#/components/schemas/OnlineBulletinBlock' }
    OnlineBulletinHymnLyrics:
      type: object
      additionalProperties: false
      required: [hymns]
      properties:
        hymns:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [id, title, sections]
            properties:
              id: { $ref: '#/components/schemas/OnlineBulletinID' }
              number: { $ref: '#/components/schemas/OnlineBulletinBlock' }
              title: { $ref: '#/components/schemas/OnlineBulletinBlock' }
              sourceLabel: { $ref: '#/components/schemas/OnlineBulletinBlock' }
              sections:
                type: array
                minItems: 1
                maxItems: 64
                items:
                  type: object
                  additionalProperties: false
                  required: [id, kind, lines]
                  properties:
                    id: { $ref: '#/components/schemas/OnlineBulletinID' }
                    kind: { type: string, enum: [verse, chorus, bridge] }
                    lines:
                      type: array
                      minItems: 1
                      maxItems: 4096
                      items: { $ref: '#/components/schemas/OnlineBulletinBlock' }
    OnlineBulletinComponent:
      oneOf:
        - $ref: '#/components/schemas/OnlineBulletinCoverComponent'
        - $ref: '#/components/schemas/OnlineBulletinBodyComponent'
        - $ref: '#/components/schemas/OnlineBulletinHymnComponent'
        - $ref: '#/components/schemas/OnlineBulletinBackComponent'
      discriminator:
        propertyName: type
        mapping:
          cover: '#/components/schemas/OnlineBulletinCoverComponent'
          bodySection: '#/components/schemas/OnlineBulletinBodyComponent'
          hymnLyrics: '#/components/schemas/OnlineBulletinHymnComponent'
          backSummary: '#/components/schemas/OnlineBulletinBackComponent'
          announcements: '#/components/schemas/OnlineBulletinBackComponent'
          victoriesAndPrayers: '#/components/schemas/OnlineBulletinBackComponent'
    OnlineBulletinCoverComponent:
      type: object
      additionalProperties: false
      required: [id, type, cover]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: cover }
        cover: { $ref: '#/components/schemas/OnlineBulletinCover' }
    OnlineBulletinBodyComponent:
      type: object
      additionalProperties: false
      required: [id, type, bodySection]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: bodySection }
        bodySection: { $ref: '#/components/schemas/OnlineBulletinBodySection' }
    OnlineBulletinHymnComponent:
      type: object
      additionalProperties: false
      required: [id, type, hymnLyrics]
      properties:
        id: { $ref: '#/components/schemas/OnlineBulletinID' }
        type: { type: string, const: hymnLyrics }
