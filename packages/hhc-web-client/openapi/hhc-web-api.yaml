      required: [operationKey, actorType, actorId, recordingId, assetVersionId, expectedVersion, publishedVersion, publishedAt, requestFingerprint]
      properties:
        operationKey: { type: string, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]{1,128}$' }
        actorType: { type: string, enum: [user, service] }
        actorId: { type: string, format: uuid }
