        visible: { type: boolean }
      oneOf:
        - properties: { key: { const: privacy-policy }, href: { pattern: '^/(?:zh-Hant|zh-Hans|en|ja|ko)/privacy-policy$' } }
        - properties: { key: { const: terms-of-use }, href: { pattern: '^/(?:zh-Hant|zh-Hans|en|ja|ko)/terms-of-use$' } }
    SiteExternalURL:
      type: string
      format: uri
      pattern: '^https://'
      allOf:
        - not: { pattern: '^https://[^/?#]*@' }
        - not: { pattern: '#' }
        - pattern: '^https://[^/?#@:]+\.[^./?#@:]*[A-Za-z][^./?#@:]*(?::[0-9]+)?(?:[/?#]|$)'
        - not: { pattern: '(?i)^https://(?:localhost|[^/?#@]+\.(?:localhost|local|internal|test|cluster\.local|azurecontainerapps\.io|azurewebsites\.net|blob\.core\.windows\.net|dfs\.core\.windows\.net|file\.core\.windows\.net|queue\.core\.windows\.net|table\.core\.windows\.net|web\.core\.windows\.net))(?::[0-9]+)?(?:[/?#]|$)' }
        - not:
            pattern: '(?i)[?&](?:s|%(?:53|73))(?:(?:i|%(?:49|69))(?:g|%(?:47|67))|(?:v|%(?:56|76))|(?:e|%(?:45|65))|(?:p|%(?:50|70))|(?:r|%(?:52|72))|(?:t|%(?:54|74))|(?:p|%(?:50|70))(?:r|%(?:52|72))|(?:i|%(?:49|69))(?:p|%(?:50|70))|(?:s|%(?:53|73))|(?:r|%(?:52|72))(?:t|%(?:54|74))|(?:k|%(?:4b|6b))(?:o|%(?:4f|6f))(?:i|%(?:49|69))(?:d|%(?:44|64))|(?:k|%(?:4b|6b))(?:t|%(?:54|74))(?:i|%(?:49|69))(?:d|%(?:44|64))|(?:k|%(?:4b|6b))(?:t|%(?:54|74))|(?:k|%(?:4b|6b))(?:e|%(?:45|65))|(?:k|%(?:4b|6b))(?:s|%(?:53|73))|(?:k|%(?:4b|6b))(?:v|%(?:56|76)))(?:=|&|#|$)'
    SiteExternalLinks:
      type: object
      additionalProperties: false
      required: [churchYoutube, churchFacebook, musicYoutube]
      properties:
        churchYoutube: { $ref: '#/components/schemas/SiteExternalURL' }
        churchFacebook: { $ref: '#/components/schemas/SiteExternalURL' }
        musicYoutube: { $ref: '#/components/schemas/SiteExternalURL' }
    SiteDisplayFields:
      type: object
      required: [locale, siteName, englishName, copyrightHolder, allRightsReserved, seoTitleSuffix, seoDescriptionFallback]
      properties:
        locale: { $ref: '#/components/schemas/ContentLocale' }
        siteName: { type: string, pattern: '\S' }
        englishName: { type: string, pattern: '\S' }
        copyrightHolder: { type: string, pattern: '\S' }
        allRightsReserved: { type: string, pattern: '\S' }
        seoTitleSuffix: { type: string, pattern: '\S' }
        seoDescriptionFallback: { type: string, pattern: '\S' }
    SiteLocaleSettings:
      allOf:
        - $ref: '#/components/schemas/SiteDisplayFields'
        - type: object
          required: [header, legal]
          properties:
            header:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: '#/components/schemas/AdminSiteHeaderNavigationItem' }
              allOf:
                - { contains: { properties: { key: { const: about } }, required: [key] }, minContains: 1, maxContains: 1 }
                - { contains: { properties: { key: { const: news } }, required: [key] }, minContains: 1, maxContains: 1 }
                - { contains: { properties: { key: { const: literature-ministry } }, required: [key] }, minContains: 1, maxContains: 1 }
            legal:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/AdminSiteLegalNavigationItem' }
              allOf:
                - { contains: { properties: { key: { const: privacy-policy } }, required: [key] }, minContains: 1, maxContains: 1 }
                - { contains: { properties: { key: { const: terms-of-use } }, required: [key] }, minContains: 1, maxContains: 1 }
      unevaluatedProperties: false
    SiteLayout:
      allOf:
        - $ref: '#/components/schemas/SiteDisplayFields'
        - type: object
          required: [header, legal, links, version, publishedAt]
          properties:
            header:
              type: array
              minItems: 3
              maxItems: 3
              items: { $ref: '#/components/schemas/PublicSiteHeaderNavigationItem' }
            legal:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/PublicSiteLegalNavigationItem' }
            links: { $ref: '#/components/schemas/SiteExternalLinks' }
            version: { type: integer, format: int64, minimum: 1 }
            publishedAt: { type: string, format: date-time }
      unevaluatedProperties: false
    SiteSettingsWriteFields:
      type: object
      required: [locales, links]
      properties:
        locales:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/SiteLocaleSettings' }
          allOf:
            - { contains: { properties: { locale: { const: zh-Hant } }, required: [locale] }, minContains: 1, maxContains: 1 }
            - { contains: { properties: { locale: { const: zh-Hans } }, required: [locale] }, minContains: 1, maxContains: 1 }
            - { contains: { properties: { locale: { const: en } }, required: [locale] }, minContains: 1, maxContains: 1 }
            - { contains: { properties: { locale: { const: ja } }, required: [locale] }, minContains: 1, maxContains: 1 }
            - { contains: { properties: { locale: { const: ko } }, required: [locale] }, minContains: 1, maxContains: 1 }
        links: { $ref: '#/components/schemas/SiteExternalLinks' }
    SiteSettingsWriteInput:
      allOf:
        - $ref: '#/components/schemas/SiteSettingsWriteFields'
      unevaluatedProperties: false
    SiteSettings:
      allOf:
        - $ref: '#/components/schemas/SiteSettingsWriteFields'
        - type: object
          required: [id, status, version, createdBy, updatedBy, createdAt, updatedAt]
          properties:
            id: { type: string, const: default }
            status: { type: string, enum: [draft, published, unpublished] }
            version: { type: integer, format: int64, minimum: 1 }
            createdBy: { type: string }
            updatedBy: { type: string }
            publishedBy: { type: string }
            publishedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
      unevaluatedProperties: false
    SiteSettingsRevision:
      type: object
      additionalProperties: false
      required: [revision, revisionType, snapshot, createdBy, createdAt]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        revisionType: { type: string, enum: [draft_saved, published, unpublished, seeded, restored_to_draft] }
        snapshot: { $ref: '#/components/schemas/SiteSettings' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
