                  data:
                    oneOf:
                    - $ref: '#/components/schemas/BulletinWatermarkReceipt'
                    - $ref: '#/components/schemas/BulletinWatermarkInvestigationHistory'
                    - $ref: '#/components/schemas/ReaderReceiptExport'
                    - $ref: '#/components/schemas/ReaderValidationExport'
                    - $ref: '#/components/schemas/ReaderPrivateExportRow'
            coveredDatasets:
              $ref: '#/components/schemas/ReaderDSRCoverage'
            recordCount: &id005
              type: integer
              minimum: 0
            nextCursor: *id002
            exceptions:
              type: array
              items:
                type: object
        meta:
          type: object
        error:
          type:
          - object
          - 'null'
