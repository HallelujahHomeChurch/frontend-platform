openapi: 3.1.0
info:
  title: HHC Web API
  version: 0.2.0
  description: |-
    Website API owns CMS records and publication state; asset-api owns file bytes, scanning, derivatives, and grants.
    Campaign routes are authorization-preserving proxies to engagement-api, which owns campaign and consent state.
tags:
  - name: Public
    description: Published website projections exposed through api-gateway.
  - name: Admin
    description: CMS administration exposed through api-gateway and authorized by trusted Account identity headers.
  - name: Authenticated
    description: Signed-in application projections exposed through api-gateway.
  - name: Private
    description: Direct Dapr service-to-service operations.
  - name: Operations
    description: Direct service health and readiness endpoints used by platform probes.
x-hhc-service: hhc-web-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/hhc-web-api
servers:
  - url: https://www.alive.org.tw/api
    description: Public and admin gateway surface; api-gateway validates browser JWTs and injects trusted identity headers.
paths:
  /admin/recordings/retention-policy:
    get:
      operationId: getRecordingRetentionPolicy
      summary: getRecordingRetentionPolicy
      description: Human administrators only. Policy changes require a fresh actor-bound preview, matching revision and explicit confirmation. Asset commits policy and audit atomically; issued grants keep up to one hour of byte cleanup grace.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:read]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      responses:
        '200': {description: RecordingRetentionPolicy, content: {application/json: {schema: {$ref: '#/components/schemas/RecordingRetentionPolicyEnvelope'}}}}
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateRecordingRetentionPolicy
      summary: updateRecordingRetentionPolicy
      description: Human administrators only. Policy changes require a fresh actor-bound preview, matching revision and explicit confirmation. Asset commits policy and audit atomically; issued grants keep up to one hour of byte cleanup grace.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:write]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateRecordingRetentionInput'}}}
      responses:
        '200': {description: RecordingRetentionPolicy, content: {application/json: {schema: {$ref: '#/components/schemas/RecordingRetentionPolicyEnvelope'}}}}
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/recordings/retention-policy/preview:
    post:
      operationId: previewRecordingRetentionPolicy
      summary: previewRecordingRetentionPolicy
      description: Human administrators only. Policy changes require a fresh actor-bound preview, matching revision and explicit confirmation. Asset commits policy and audit atomically; issued grants keep up to one hour of byte cleanup grace.
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:write]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PreviewRecordingRetentionInput'}}}
      responses:
        '200': {description: RecordingRetentionPreview, content: {application/json: {schema: {$ref: '#/components/schemas/RecordingRetentionPreviewEnvelope'}}}}
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /legal/common:
    get:
      operationId: getCommonLegalSnapshot
      summary: getCommonLegalSnapshot
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      security: []
      parameters:
        - in: query
          name: locale
          schema: { $ref: "#/components/schemas/LegalLocale" }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalSnapshotEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSnapshotEnvelope' }
  /member/legal/current:
    get:
      operationId: getMemberLegalSnapshot
      summary: getMemberLegalSnapshot
      tags: [Authenticated]
      x-hhc-visibility: authenticated
      x-hhc-callers: [api-gateway, hhc-line-function-bot]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      x-hhc-cache: private, no-store
      parameters:
        - in: query
          name: locale
          schema: { $ref: "#/components/schemas/LegalLocale" }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalSnapshotEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSnapshotEnvelope' }
  /admin/legal/{scope}:
    get:
      operationId: getLegalDraft
      summary: getLegalDraft
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:pages:read]
      parameters:
        - in: path
          name: scope
          required: true
          schema: { $ref: "#/components/schemas/LegalScope" }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalDraftEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDraftEnvelope' }
    put:
      operationId: saveLegalDraft
      summary: saveLegalDraft
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:pages:write]
      parameters:
        - in: path
          name: scope
          required: true
          schema: { $ref: "#/components/schemas/LegalScope" }
        - in: header
          name: If-Match
          required: true
          schema: { type: string, description: Quoted draft version; zero creates the initial draft. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalDraft" }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalDraftEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDraftEnvelope' }
  /admin/legal/{scope}/publish:
    post:
      operationId: publishLegalDraft
      summary: publishLegalDraft
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:pages:publish]
      parameters:
        - in: path
          name: scope
          required: true
          schema: { $ref: "#/components/schemas/LegalScope" }
        - in: header
          name: If-Match
          required: true
          schema: { type: string, description: Quoted draft version; zero creates the initial draft. }
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalSnapshotsEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSnapshotsEnvelope' }
  /priv/legal/current:
    post:
      operationId: resolveCurrentLegalSnapshot
      summary: resolveCurrentLegalSnapshot
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, operations-api]
      security: [{ daprApiToken: [], daprCallerAppId: [] }]
      servers: [{ url: / }]
      x-hhc-cache: private, no-store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalCurrentInput" }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalSnapshotEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSnapshotEnvelope' }
  /priv/legal/snapshots/resolve:
    post:
      operationId: resolveLegalSnapshot
      summary: resolveLegalSnapshot
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      security: [{ daprApiToken: [], daprCallerAppId: [] }]
      servers: [{ url: / }]
      x-hhc-cache: private, no-store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalSnapshotInput" }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: LegalSnapshotEnvelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalSnapshotEnvelope' }
  /admin/recordings/watermark-lookups:
    post:
      operationId: lookupRecordingWatermark
      summary: Resolve an exact recording code to its issuance account (not proof of the person sharing it)
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:recordings:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingWatermarkLookupInput' }
      responses:
        '200':
          description: Exact issuance receipt; never cached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingWatermarkLookupEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/bulletins/watermark-lookups:
    post:
      operationId: lookupBulletinWatermark
      summary: Resolve an exact document code to its issuance account
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      responses:
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: BulletinWatermarkLookupEnvelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulletinWatermarkLookupEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulletinWatermarkLookupInput'
  /admin/bulletins/{issueId}/watermark-versions:
    get:
      operationId: listBulletinWatermarkVersions
      summary: List eligible retained reconstruction locales
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      responses:
        '200':
          description: List eligible retained reconstruction versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulletinWatermarkVersionsEnvelope'
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
      parameters:
      - in: path
        name: issueId
        required: true
        schema:
          type: string
          format: uuid
  /admin/bulletins/{issueId}/watermark-investigations:
    get:
      operationId: listBulletinWatermarkInvestigations
      summary: List retained investigations for one bulletin issue
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
      - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Issue investigation history, content: { application/json: { schema: { $ref: '#/components/schemas/BulletinWatermarkInvestigationPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/bulletin-watermark-investigations:
    get:
      operationId: listGlobalBulletinWatermarkInvestigations
      summary: List retained bulletin investigations across issues
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      parameters:
      - { name: cursor, in: query, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      - { name: sort, in: query, schema: { type: string, enum: [submitted, requested, actual, status, operator, account, issued] } }
      - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: Global investigation history, content: { application/json: { schema: { $ref: '#/components/schemas/BulletinWatermarkInvestigationGlobalPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createBulletinWatermarkInvestigation
      summary: Queue a private document investigation
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      responses:
        '202':
          description: Queue a private document investigation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulletinWatermarkInvestigationAcceptedEnvelope'
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: Stable UUID for retries. Reuse with changed content returns 409.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              - files
              properties:
                metadata:
                  type: string
                  maxLength: 8192
                  contentMediaType: application/json
                  contentSchema:
                    $ref: '#/components/schemas/BulletinWatermarkInvestigationInput'
                  description: JSON BulletinWatermarkInvestigationInput; unknown fields
                    rejected.
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
                  description: PNG, JPEG, or PDF files totaling at most 10 MiB.
  /admin/bulletin-watermark-investigations/{id}:
    get:
      operationId: getBulletinWatermarkInvestigation
      summary: Read the creator-owned investigation and audited result
      tags: [Admin]
      x-hhc-visibility: admin
      x-hhc-callers: [api-gateway]
      x-hhc-cache: private, no-store
      x-required-scopes: [cms:bulletins:investigate]
      security: [{ daprApiToken: [], daprCallerAppId: [], trustedUserId: [], trustedAuthProvider: [], trustedScopes: [] }]
      servers: [{ url: https://admin.alive.org.tw/api }]
      responses:
        '200':
          description: Read the creator-owned investigation and audited result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulletinWatermarkInvestigationEnvelope'
        '401': { $ref: '#/components/responses/AdminUnauthorized' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
  /priv/bulletin-watermarks/dsr/exports:
    post:
      operationId: applyBulletinWatermarkDSRExport
      parameters:
      - in: query
        name: coverage
        schema: { type: string, enum: [reader-v1] }
        description: Request explicit reader dataset coverage. Omitted for legacy response compatibility.
      summary: Process Account-owned watermark DSR export
      description: >-
        Receipt UUID cursors remain valid. After the last receipt page, investigations:
        starts the investigation phase; subsequent cursors append a job UUID.
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      x-hhc-required-headers:
      - Dapr-Caller-App-Id
      - dapr-api-token
      x-hhc-cache: private, no-store
      security: [{ daprApiToken: [], daprCallerAppId: [] }]
      servers: [{ url: / }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
          description: BulletinWatermarkDSRExportEnvelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulletinWatermarkDSRExportEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulletinWatermarkDSRExportInput'
  /priv/bulletin-watermarks/dsr/actions:
    post:
      operationId: applyBulletinWatermarkDSRAction
      parameters:
      - in: query
        name: coverage
        schema: { type: string, enum: [reader-v1] }
        description: Request explicit reader dataset coverage. Account must require every dataset before completion.
      summary: Process Account-owned watermark DSR action
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      x-hhc-required-headers:
      - Dapr-Caller-App-Id
      - dapr-api-token
      x-hhc-cache: private, no-store
      security: [{ daprApiToken: [], daprCallerAppId: [] }]
      servers: [{ url: / }]
      responses:
        '409': { description: Original restriction has already been withdrawn }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '200':
