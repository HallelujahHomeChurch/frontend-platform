        publishedVersion: { type: integer, format: int64, minimum: 2 }
        publishedAt: { type: string, format: date-time }
        requestFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the versioned canonical empty-body publication request with actor, recording, asset and expected version.' }
    RecordingPublishResult:
      type: object
