components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ActorUserID: { name: X-HHC-User-ID, in: header, required: true, schema: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' } }
    StatusAction: { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, restore, archive] } }
    OccurrenceDate: { name: date, in: path, required: true, schema: { type: string, format: date } }
    UserID: { name: userId, in: query, schema: { type: string, format: uuid } }
    OrgUnitID: { name: orgUnitId, in: query, schema: { type: string, format: uuid } }
    Status: { name: status, in: query, schema: { type: string } }
    EffectiveAt: { name: effectiveAt, in: query, schema: { type: string, format: date-time } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    Scopes: { name: X-HHC-Scopes, in: header, required: true, schema: { type: string }, description: Gateway-verified opaque space-delimited Account scopes; an empty value is authenticated with no staff permissions. }
  schemas:
    OperationStatus:
      type: string
      enum: [active, paused, archived]
    OrgUnitKind:
      type: string
      enum: [organization, congregation, family, small_group]
    Visibility:
      type: string
      enum: [public, internal]
    OrgUnitInput:
      type: object
      additionalProperties: false
      required: [key, kind, name]
      properties:
        key: { type: string }
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
        description: { type: string }
        parentId: { type: string, format: uuid }
    OrgUnit:
      type: object
      required: [id, key, kind, name, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
        description: { type: string }
        parentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
    ResourceInput:
      type: object
      additionalProperties: false
      required: [key, name, kind, churchUnitId, timezone, visibility]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, const: venue }
        churchUnitId: { type: string, format: uuid }
        locationContentId: { type: string, format: uuid }
        timezone: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Resource:
      type: object
      required: [id, key, name, kind, churchUnitId, timezone, visibility, reservationEnabled, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, const: venue }
        churchUnitId: { type: string, format: uuid }
        locationContentId: { type: string, format: uuid }
        timezone: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        reservationEnabled: { type: boolean }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
    Schedule:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [weekly, once] }
        daysOfWeek: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        startsAt: { type: string, format: date-time }
    MeetingInput:
      type: object
      additionalProperties: false
      required: [key, name, churchUnitId, venueResourceId, timezone, schedule, durationMinutes, visibility]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Meeting:
      type: object
      required: [id, key, name, churchUnitId, venueResourceId, timezone, schedule, durationMinutes, visibility, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
        nextOccurrence: { type: object }
    OccurrenceOverrideInput:
      type: object
      additionalProperties: false
      required: [cancelled]
      properties:
        cancelled: { type: boolean }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        venueResourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
    OccurrenceOverride:
      type: object
      required: [meetingId, occurrenceDate, cancelled, version]
      properties:
        meetingId: { type: string, format: uuid }
        occurrenceDate: { type: string, format: date }
        cancelled: { type: boolean }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        venueResourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
        version: { type: integer, minimum: 1 }
    CollectionBindingInput:
      type: object
      additionalProperties: false
      required: [collectionIds]
      properties:
        collectionIds: { type: array, items: { type: string, minLength: 1, maxLength: 200 } }
    MembershipStatus:
      type: string
      enum: [pending, active, suspended, left, rejected]
    QualificationStatus:
      type: string
      enum: [pending, active, suspended, revoked, expired]
    AssignmentStatus:
      type: string
      enum: [active, suspended, revoked, expired]
    OrgRoleName:
      type: string
      enum: [pastor, family_leader, small_group_leader, meeting_manager, resource_manager, reservation_approver]
    EntitlementCode:
      type: string
      enum: [bulletin.general.zh-Hant.access, bulletin.general.zh-Hans.access, bulletin.general.en.access]
    MembershipInput:
      type: object
      additionalProperties: false
      required: [userId, orgUnitId, status, validFrom]
      properties:
        userId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        status: { type: string, const: active }
        isPrimary: { type: boolean, default: false }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    Membership:
      type: object
      additionalProperties: false
      required: [id, userId, orgUnitId, status, isPrimary, validFrom, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        isPrimary: { type: boolean }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    QualificationInput:
      type: object
      additionalProperties: false
      required: [userId, status, validFrom]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, const: pending }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reasonCode: { type: string, maxLength: 100 }
    Qualification:
      type: object
      additionalProperties: false
      required: [id, userId, status, validFrom, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/QualificationStatus' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reasonCode: { type: string, maxLength: 100 }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    EntitlementInput:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, entitlementCode, source, validFrom]
      properties:
        subjectType: { type: string, enum: [user, org_members, qualification_bundle] }
        subjectId: { type: string }
        entitlementCode: { $ref: '#/components/schemas/EntitlementCode' }
        source: { type: string, enum: [manual_assignment, organization_assignment, event_registration, qualification_bundle] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
      oneOf:
        - properties:
            subjectType: { type: string, const: user }
            subjectId: { type: string, format: uuid }
            source: { type: string, enum: [manual_assignment, event_registration] }
        - properties:
            subjectType: { type: string, const: org_members }
            subjectId: { type: string, format: uuid }
            source: { type: string, const: organization_assignment }
        - properties:
            subjectType: { type: string, const: qualification_bundle }
            subjectId: { type: string, const: active_members, description: Compiled built-in bundle for subjects with an active membership qualification. }
            source: { type: string, const: qualification_bundle }
    Entitlement:
      type: object
      additionalProperties: false
      required: [id, subjectType, subjectId, entitlementCode, source, status, validFrom, assignedBy, assignedAt, version]
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, org_members, qualification_bundle] }
        subjectId: { type: string }
        entitlementCode: { $ref: '#/components/schemas/EntitlementCode' }
        source: { type: string, enum: [manual_assignment, organization_assignment, event_registration, qualification_bundle] }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedBy: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
      oneOf:
        - properties:
            subjectType: { type: string, const: user }
            subjectId: { type: string, format: uuid }
            source: { type: string, enum: [manual_assignment, event_registration] }
        - properties:
            subjectType: { type: string, const: org_members }
            subjectId: { type: string, format: uuid }
            source: { type: string, const: organization_assignment }
        - properties:
            subjectType: { type: string, const: qualification_bundle }
            subjectId: { type: string, const: active_members, description: Compiled built-in bundle for subjects with an active membership qualification. }
            source: { type: string, const: qualification_bundle }
    OrgRoleInput:
      type: object
      additionalProperties: false
      required: [userId, orgUnitId, role, validFrom]
      properties:
        userId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    OrgRole:
      type: object
      additionalProperties: false
      required: [id, userId, orgUnitId, role, status, validFrom, assignedBy, assignedAt, version]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
        status: { type: string, enum: [active, revoked] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedBy: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MembershipList:
      type: array
      items: { $ref: '#/components/schemas/Membership' }
    QualificationList:
      type: array
      items: { $ref: '#/components/schemas/Qualification' }
    EntitlementList:
      type: array
      items: { $ref: '#/components/schemas/Entitlement' }
    OrgRoleList:
      type: array
      items: { $ref: '#/components/schemas/OrgRole' }
    EntitlementCheckRequest:
      type: object
      additionalProperties: false
      required: [subjectId, entitlementCodes]
      properties:
        subjectId: { type: string, format: uuid }
        entitlementCodes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, pattern: '^[a-z][A-Za-z0-9.-]{0,99}$' }
    EntitlementDecision:
      type: object
      additionalProperties: false
      required: [entitlementCode, decision, reason, version]
      properties:
        entitlementCode: { type: string }
        decision: { type: string, enum: [allow, deny] }
        reason: { type: string, enum: [allowed, membership_required, membership_suspended, entitlement_required] }
        version: { type: string, pattern: '^[0-9a-f]{64}$' }
    EntitlementCheckResponse:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/EntitlementDecision' }
    OrgUnitSummary:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [membershipId, orgUnit, isPrimary, validFrom]
      properties:
        membershipId: { type: string, format: uuid }
        orgUnit: { $ref: '#/components/schemas/OrgUnitSummary' }
        isPrimary: { type: boolean }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    OrgRoleSummary:
      type: object
      additionalProperties: false
      required: [assignmentId, role, orgUnit, validFrom]
      properties:
        assignmentId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
        orgUnit: { $ref: '#/components/schemas/OrgUnitSummary' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    QualificationSummary:
      type: object
      additionalProperties: false
      required: [qualificationId, validFrom]
      properties:
        qualificationId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    EntitlementSummary:
      type: object
      additionalProperties: false
      required: [assignmentId, entitlementCode, validFrom]
      properties:
        assignmentId: { type: string, format: uuid }
        entitlementCode: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    AccessSnapshot:
      type: object
      additionalProperties: false
      required: [memberships, orgRoles, qualifications, entitlements, version]
      properties:
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipSummary' } }
        orgRoles: { type: array, items: { $ref: '#/components/schemas/OrgRoleSummary' } }
        qualifications: { type: array, items: { $ref: '#/components/schemas/QualificationSummary' } }
        entitlements: { type: array, items: { $ref: '#/components/schemas/EntitlementSummary' } }
        version: { type: string, pattern: '^[0-9a-f]{64}$' }
    DSRExportRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId]
      properties:
        requestId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        userId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        cursor: { type: string, maxLength: 1024 }
        limit: { type: integer, minimum: 0, maximum: 100 }
    DSRActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId, action, idempotencyKey]
      properties:
        requestId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        userId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        action: { type: string, enum: [restrict_processing, erase] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    DSRException:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [audit_retained, central_audit_outbox_retained, shared_operations_retained, relationship_attribution_retained, reservation_history_retained, reservation_attribution_retained, processing_restriction_retained, dsr_action_result_retained] }
        count: { type: integer, format: int64, minimum: 0 }
    DSRExportRecord:
      type: object
      additionalProperties: false
      required: [recordType, recordKey, data]
      properties:
        recordType: { type: string, enum: [org_membership, org_role_assignment, membership_qualification, entitlement_assignment, resource_reservation] }
        recordKey: { type: string, format: uuid }
        data: { type: object, additionalProperties: true }
    DSRExportPage:
      type: object
      additionalProperties: false
      required: [records, recordCount, exceptions]
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/DSRExportRecord' } }
        nextCursor: { type: string }
        recordCount: { type: integer, minimum: 0 }
        exceptions: { type: array, items: { $ref: '#/components/schemas/DSRException' } }
    DSRExportEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/DSRExportPage' } }
    DSRActionResult:
      type: object
      additionalProperties: false
      required: [owner, action, status, recordCount, reasonCodes]
      properties:
        owner: { type: string, const: operations-api }
        action: { type: string, enum: [restrict_processing, erase] }
        status: { type: string, const: completed }
        recordCount: { type: integer, format: int64, minimum: 0 }
        reasonCodes: { type: array, items: { type: string, enum: [audit_retained, shared_operations_retained, reservation_history_retained, reservation_attribution_retained, processing_restriction_retained] } }
    DSRActionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/DSRActionResult' } }
    ReservationStatus:
      type: string
      enum: [requested, approved, rejected, cancelled]
    ReservableResource:
      type: object
      additionalProperties: false
      required: [id, key, name, timezone]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        timezone: { type: string }
    BusyInterval:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Availability:
      type: object
      additionalProperties: false
      required: [busyIntervals]
      properties: { busyIntervals: { type: array, items: { $ref: '#/components/schemas/BusyInterval' } } }
    ResourceReservationInput:
      type: object
      additionalProperties: false
      required: [resourceId, purpose, startsAt, endsAt]
      properties:
        resourceId: { type: string, format: uuid }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Exclusive end; the interval is half-open and may not exceed 366 days. }
    ResourceReservation:
      type: object
      additionalProperties: false
      required: [id, resourceId, requesterUserId, purpose, startsAt, endsAt, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        requesterUserId: { type: string, format: uuid }
        purpose: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    ReservationSettings:
      type: object
      additionalProperties: false
      required: [resourceId, enabled, version]
      properties:
        resourceId: { type: string, format: uuid }
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    ResourceMaintenanceInput:
      type: object
      additionalProperties: false
      required: [resourceId, reason, startsAt, endsAt]
      properties:
        resourceId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Exclusive end; the interval is half-open and may not exceed 366 days. }
    ResourceMaintenanceBlock:
      type: object
      additionalProperties: false
      required: [id, resourceId, reason, startsAt, endsAt, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [active, cancelled] }
        createdBy: { type: string, format: uuid }
        cancelledBy: { type: string, format: uuid }
        cancelledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: healthy }
    Ready:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ready }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  securitySchemes:
    daprCallerAppID:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Dapr API token required for private Operations service calls.
    gatewayPrincipal:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Trusted canonical Account subject injected by the Gateway or propagated by an allowlisted internal caller.
  responses:
    ProtectedHeaderRejected:
      description: A gateway-protected identity header is invalid on a public route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotReady:
      description: PostgreSQL is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
