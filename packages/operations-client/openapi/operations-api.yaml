openapi: 3.1.0
info:
  title: HHC Operations API
  version: 0.1.0
  description: Church operations service for the organization kernel, membership, qualification, entitlements, and scoped responsibilities.
tags:
  - name: Operations
    description: Church operations records and service probes.
x-hhc-service: operations-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/operations-api
servers:
  - url: /
    description: Direct service probe base.
paths:
  /priv/operations/org-units:
    get:
      tags: [Operations]
      operationId: listOrgUnits
      summary: List organization units for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses:
        '200': { description: Organization units }
        '401': { description: Missing caller identity }
        '403': { description: Caller is not allowlisted }
    post:
      tags: [Operations]
      operationId: createOrgUnit
      summary: Create an organization unit
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/org-units/{id}:
    get:
      tags: [Operations]
      operationId: getOrgUnit
      summary: Get an organization unit for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Organization unit }
        '404': { description: Organization unit not found }
    put:
      tags: [Operations]
      operationId: updateOrgUnit
      summary: Update an organization unit
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
  /priv/operations/org-units/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionOrgUnitStatus
      summary: Change an organization unit status
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid or same-state transition }, '412': { description: Version mismatch } }
  /priv/operations/meetings:
    get:
      tags: [Operations]
      operationId: listMeetings
      summary: List operational meetings for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses:
        '200': { description: Meetings }
    post:
      tags: [Operations]
      operationId: createMeeting
      summary: Create a meeting kernel record
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/resources:
    get:
      tags: [Operations]
      operationId: listResources
      summary: List resources for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses: { '200': { description: Resources } }
    post:
      tags: [Operations]
      operationId: createResource
      summary: Create a resource kernel record
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/resources/{id}:
    get:
      tags: [Operations]
      operationId: getResource
      summary: Get a resource
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Resource }, '404': { description: Resource not found } }
    put:
      tags: [Operations]
      operationId: updateResource
      summary: Update a resource
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
  /priv/operations/resources/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionResourceStatus
      summary: Change a resource status
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '400': { description: Invalid or same-state transition }, '412': { description: Version mismatch } }
  /priv/operations/meetings/{id}:
    get:
      tags: [Operations]
      operationId: getMeeting
      summary: Get a meeting with overrides and collection bindings
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Meeting detail } }
    put:
      tags: [Operations]
      operationId: updateMeeting
      summary: Update a meeting
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
  /priv/operations/meetings/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionMeetingStatus
      summary: Change a meeting status
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid or same-state transition }, '412': { description: Version mismatch } }
  /priv/operations/meetings/{id}/overrides/{date}:
    put:
      tags: [Operations]
      operationId: putMeetingOverride
      summary: Put a meeting occurrence override
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OccurrenceDate' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OccurrenceOverrideInput' } } } }
      responses: { '200': { description: Occurrence override, content: { application/json: { schema: { $ref: '#/components/schemas/OccurrenceOverride' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
    delete:
      tags: [Operations]
      operationId: deleteMeetingOverride
      summary: Delete a meeting occurrence override
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OccurrenceDate' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid mutation }, '404': { description: Override not found }, '412': { description: Version mismatch } }
  /priv/operations/meetings/{id}/collections:
    put:
      tags: [Operations]
      operationId: replaceMeetingCollections
      summary: Replace meeting collection bindings
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionBindingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
  /priv/operations/occurrences:
    get:
      tags: [Operations]
      operationId: listOccurrences
      summary: Resolve meeting occurrences in a bounded range
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses: { '200': { description: Occurrences } }
  /priv/operations/sync-windows:
    get:
      tags: [Operations]
      operationId: listSyncWindows
      summary: List collection-bound media sync windows
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses: { '200': { description: Sync windows } }
  /api/admin/operations/memberships:
    get:
      tags: [Operations]
      operationId: listMemberships
      summary: List organization memberships
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/UserID' }, { $ref: '#/components/parameters/OrgUnitID' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/EffectiveAt' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Memberships
          content: { application/json: { schema: { $ref: '#/components/schemas/MembershipList' } } }
        '401': { description: Authentication required }
        '403': { description: Permission required }
    post:
      tags: [Operations]
      operationId: createMembership
      summary: Approve an organization membership
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipInput' }
      responses:
        '200':
          description: Membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '409': { description: Conflict }
  /api/admin/operations/memberships/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionMembership
      summary: Transition a membership lifecycle
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, suspend, depart, reactivate] } }, { $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Membership
          content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } }
        '412': { description: Version mismatch }
  /api/admin/operations/membership-qualifications:
    get:
      tags: [Operations]
      operationId: listMembershipQualifications
      summary: List membership qualifications
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/UserID' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/EffectiveAt' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Qualifications
          content: { application/json: { schema: { $ref: '#/components/schemas/QualificationList' } } }
    post:
      tags: [Operations]
      operationId: createMembershipQualification
      summary: Create a pending membership qualification
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualificationInput' }
      responses:
        '200':
          description: Qualification
          content: { application/json: { schema: { $ref: '#/components/schemas/Qualification' } } }
  /api/admin/operations/membership-qualifications/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionMembershipQualification
      summary: Transition a qualification lifecycle
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, suspend, revoke, expire] } }, { $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Qualification
          content: { application/json: { schema: { $ref: '#/components/schemas/Qualification' } } }
        '412': { description: Version mismatch }
  /api/admin/operations/entitlement-assignments:
    get:
      tags: [Operations]
      operationId: listEntitlementAssignments
      summary: List member entitlement assignments
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: subjectId, in: query, schema: { type: string } }, { name: entitlementCode, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/EffectiveAt' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Entitlement assignments
          content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementList' } } }
    post:
      tags: [Operations]
      operationId: createEntitlementAssignment
      summary: Grant a compiled member entitlement
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementInput' }
      responses:
        '200':
          description: Entitlement assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } }
  /api/admin/operations/entitlement-assignments/{id}/revoke:
    post:
      tags: [Operations]
      operationId: revokeEntitlementAssignment
      summary: Revoke a member entitlement assignment
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Entitlement assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } }
        '412': { description: Version mismatch }
  /api/admin/operations/org-role-assignments:
    get:
      tags: [Operations]
      operationId: listOrgRoleAssignments
      summary: List scoped organization responsibilities
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/UserID' }, { $ref: '#/components/parameters/OrgUnitID' }, { name: role, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/EffectiveAt' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Organization role assignments
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgRoleList' } } }
    post:
      tags: [Operations]
      operationId: createOrgRoleAssignment
      summary: Grant a scoped organization responsibility
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgRoleInput' }
      responses:
        '200':
          description: Organization role assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgRole' } } }
        '409': { description: Idempotency conflict }
  /api/admin/operations/org-role-assignments/{assignmentId}/revoke:
    post:
      tags: [Operations]
      operationId: revokeOrgRoleAssignment
      summary: Revoke a scoped organization responsibility
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Organization role assignment
          content: { application/json: { schema: { $ref: '#/components/schemas/OrgRole' } } }
        '412': { description: Version mismatch }
  /priv/operations/entitlement-checks:
    post:
      tags: [Operations]
      operationId: checkEntitlements
      summary: Resolve exact member entitlement decisions for an allowlisted service
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementCheckRequest' }
      responses:
        '200':
          description: Ordered entitlement decisions
          content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementCheckResponse' } } }
        '400': { description: Invalid subject or entitlement code list }
        '401': { description: Missing caller identity }
        '403': { description: Caller is not allowlisted }
        '503': { description: Authorization facts are unavailable }
  /api/operations/me/access:
    get:
      tags: [Operations]
      operationId: getMyOperationsAccess
      summary: Get the authenticated subject's presentation-safe Operations access facts
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/Scopes' }]
      responses:
        '200':
          description: Presentation-safe Operations access snapshot
          content: { application/json: { schema: { $ref: '#/components/schemas/AccessSnapshot' } } }
        '400': { description: Malformed or duplicate trusted identity headers }
        '401': { description: Missing trusted identity }
        '503': { description: Authorization facts are unavailable }
  /api/operations/me/resources:
    get:
      tags: [Operations]
      operationId: listMyReservableResources
      summary: List resources available to the qualified member
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/Scopes' }]
      responses: { '200': { description: Eligible resources, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReservableResource' } } } } }, '400': { description: Malformed identity }, '401': { description: Missing identity } }
  /api/operations/me/resources/{resourceKey}/availability:
    get:
      tags: [Operations]
      operationId: getMyResourceAvailability
      summary: Get privacy-safe merged Resource availability
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: resourceKey, in: path, required: true, schema: { type: string } }, { name: from, in: query, required: true, schema: { type: string, format: date-time } }, { name: to, in: query, required: true, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Scopes' }]
      responses: { '200': { description: Privacy-safe merged busy intervals, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }, '400': { description: Invalid range }, '401': { description: Missing identity }, '404': { description: Resource unavailable to subject } }
  /api/operations/me/resource-reservations:
    get:
      tags: [Operations]
      operationId: listMyResourceReservations
      summary: List the authenticated member's reservations
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/Scopes' }]
      responses: { '200': { description: Own reservations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResourceReservation' } } } } } }
    post:
      tags: [Operations]
      operationId: createMyResourceReservation
      summary: Request one Resource for a half-open interval
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/Scopes' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceReservationInput' } } } }
      responses: { '201': { description: Requested reservation, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceReservation' } } } }, '400': { description: Invalid request }, '403': { description: "Qualification, membership, or DSR restriction denies processing" }, '409': { description: Idempotency conflict } }
  /api/operations/me/resource-reservations/{reservationId}:
    get:
      tags: [Operations]
      operationId: getMyResourceReservation
      summary: Get one reservation owned by the authenticated member
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Scopes' }]
      responses: { '200': { description: Own reservation, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceReservation' } } } }, '404': { description: Not found } }
  /api/operations/me/resource-reservations/{reservationId}/cancel:
    post:
      tags: [Operations]
      operationId: cancelMyResourceReservation
      summary: Cancel an owned requested or approved reservation
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Scopes' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Cancelled reservation, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceReservation' } } } }, '400': { description: Invalid terminal transition }, '404': { description: Not found }, '412': { description: Version mismatch } }
  /api/admin/operations/resources/{resourceId}/reservation-settings:
    get:
      tags: [Operations]
      operationId: getResourceReservationSettings
