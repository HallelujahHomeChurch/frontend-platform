openapi: 3.1.0
info:
  title: HHC Operations API
  version: 0.1.0
  description: Church operations service for the organization kernel, membership, entitlements, and scoped responsibilities.
tags:
  - name: Operations
    description: Church operations records and service probes.
x-hhc-service: operations-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/operations-api
servers:
  - url: /
    description: Direct service probe base.
paths:
  /api/meetings:
    get:
      tags: [Operations]
      operationId: listPublicMeetings
      summary: List active public meetings
      x-hhc-visibility: public
      security: []
      responses: { '200': { description: Public meetings, content: { application/json: { schema: { $ref: '#/components/schemas/PublicMeetingList' } } } }, '400': { description: Protected identity header rejected } }
  /api/meetings/{meetingKey}:
    get:
      tags: [Operations]
      operationId: getPublicMeeting
      summary: Get an active public meeting
      x-hhc-visibility: public
      security: []
      parameters: [{ name: meetingKey, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Public meeting, content: { application/json: { schema: { $ref: '#/components/schemas/PublicMeeting' } } } }, '404': { description: Meeting not found } }
  /api/meeting-occurrences:
    get:
      tags: [Operations]
      operationId: listPublicMeetingOccurrences
      summary: List public meeting occurrences within a bounded window
      x-hhc-visibility: public
      security: []
      parameters: [{ name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { description: Public meeting occurrences, content: { application/json: { schema: { $ref: '#/components/schemas/PublicOccurrenceList' } } } }, '400': { description: Invalid window } }
  /api/meeting-sync-windows:
    get:
      tags: [Operations]
      operationId: listAuthenticatedMeetingSyncWindows
      summary: List media sync windows for an authenticated account
      x-hhc-visibility: authenticated
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { description: Meeting sync windows }, '401': { description: Authentication required } }
  /api/admin/operations/org-units:
    get:
      tags: [Operations]
      operationId: listAdminOrgUnits
      summary: List organization units
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses: { '200': { description: Organization units, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitList' } } } }, '403': { description: Permission denied } }
    post:
      tags: [Operations]
      operationId: createAdminOrgUnit
      summary: Create an organization unit
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '201': { description: Organization unit created, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '403': { description: Permission denied } }
  /api/admin/operations/org-units/batch:
    post:
      tags: [Operations]
      operationId: createAdminOrgUnitBatch
      summary: Atomically create multiple organization units
      x-hhc-visibility: admin
      x-hhc-authorization: Global Administrator for church roots; otherwise global or scoped membership structure authority
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitBatchInput' } } } }
      responses: { '201': { description: Organization units created atomically, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitList' } } } }, '400': { description: Invalid row or parent reference }, '403': { description: Scope denied }, '409': { description: Duplicate sibling or idempotency conflict } }
  /api/admin/operations/options/{domain}:
    get:
      tags: [Operations]
      operationId: getAdminOperationOptions
      summary: List scoped reference data needed by one Operations domain
      description: The server authorizes every returned organization unit with the exact read action selected by domain.
      x-hhc-visibility: admin
      x-hhc-required-permission-by-domain:
        meetings: operations:meetings:read
        resources: operations:resources:read
        reservations: operations:reservations:read
      security: [{ gatewayPrincipal: [] }]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string, enum: [meetings, resources, reservations] }
      responses:
        '200': { description: Scoped reference options, content: { application/json: { schema: { $ref: '#/components/schemas/OperationOptions' } } } }
        '403': { description: Permission denied }
        '503': { description: Authorization unavailable }
  /api/admin/operations/org-units/{id}:
    get:
      tags: [Operations]
      operationId: getAdminOrgUnit
      summary: Get an organization unit
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '403': { description: Permission denied }, '404': { description: Not found } }
    put:
      tags: [Operations]
      operationId: updateAdminOrgUnit
      summary: Update an organization unit
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '403': { description: Permission denied }, '412': { description: Version mismatch } }
    delete:
      tags: [Operations]
      operationId: deleteUnusedAdminOrgUnit
      summary: Permanently delete a never-used organization unit
      x-hhc-visibility: admin
      x-hhc-authorization: Global Administrator for church roots; otherwise global or scoped membership structure authority
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteConfirmation' } } } }
      responses: { '204': { description: Deleted }, '403': { description: Scope denied }, '409': { description: Unit has historical dependencies }, '412': { description: Version mismatch } }
  /api/admin/operations/org-units/{id}/dependencies:
    get:
      tags: [Operations]
      operationId: getAdminOrgUnitDependencies
      summary: Preview organization unit archive and delete dependencies
      x-hhc-visibility: admin
      x-hhc-authorization: Global Administrator for church roots; otherwise global or scoped membership structure authority
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Dependency preview, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitDependencies' } } } }, '403': { description: Scope denied }, '404': { description: Not found } }
  /api/admin/operations/org-units/{id}/member-candidates:
    get:
      tags: [Operations]
      operationId: listAdminOrgUnitMemberCandidates
      summary: Search only the membership candidates allowed for this organization unit
      x-hhc-visibility: admin
      x-hhc-authorization: Global or scoped roster authority for the target unit
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { name: q, in: query, schema: { type: string, maxLength: 200 } }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Scoped candidates, content: { application/json: { schema: { $ref: '#/components/schemas/MemberViewList' } } } }, '403': { description: Scope denied }, '503': { description: Account labels unavailable } }
  /api/admin/operations/org-units/{id}/account-candidates:
    get:
      tags: [Operations]
      operationId: listOrgUnitAccountCandidates
      summary: Search active HHC Accounts for admission to this unit
      x-hhc-visibility: admin
      x-hhc-authorization: Global or scoped roster authority for the target unit
      security: [{ gatewayPrincipal: [] }]
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Account candidates with current membership state, content: { application/json: { schema: { $ref: '#/components/schemas/JoinCandidatePage' } } } }, '403': { description: Scope denied }, '503': { description: Account directory unavailable } }
  /api/admin/operations/org-units/{id}/members:
    get:
      tags: [Operations]
      operationId: listCurrentOrgUnitMembers
      summary: List active members whose deepest affiliation is the current unit
      x-hhc-visibility: admin
      x-hhc-authorization: Global member read or scoped responsibility for the target unit
      security: [{ gatewayPrincipal: [] }]
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses: { '200': { description: Current-unit member page, content: { application/json: { schema: { $ref: '#/components/schemas/UnitMemberPage' } } } }, '403': { description: Scope denied }, '422': { description: Account search is too broad }, '503': { description: Account labels unavailable } }
  /api/admin/operations/org-units/{id}/members/batch:
    post:
      tags: [Operations]
      operationId: admitOrgUnitMembersBatch
      summary: Admit multiple Accounts directly to the target unit
      x-hhc-visibility: admin
      x-hhc-authorization: Global or scoped roster authority for the target unit
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitMemberBatchInput' } } } }
      responses: { '200': { description: Row-addressable admission results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MemberBatchResult' } } } } }, '403': { description: Scope denied }, '503': { description: Account directory unavailable } }
  /api/admin/operations/org-units/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionAdminOrgUnitStatus
      summary: Change an organization unit status
      x-hhc-visibility: admin
      x-hhc-required-permission: memberships:manage
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '403': { description: Permission denied }, '412': { description: Version mismatch } }
  /api/admin/operations/resources:
    get:
      tags: [Operations]
      operationId: listAdminResources
      summary: List resources in the caller effective scope
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:resources:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses: { '200': { description: Scoped resources, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }, '503': { description: Authorization unavailable } }
    post:
      tags: [Operations]
      operationId: createAdminResource
      summary: Create a resource in an authorized organization unit
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:resources:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '201': { description: Resource created, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '403': { description: Scope denied }, '503': { description: Authorization unavailable } }
  /api/admin/operations/resources/{id}:
    get:
      tags: [Operations]
      operationId: getAdminResource
      summary: Get a resource in the caller effective scope
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:resources:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '403': { description: Scope denied }, '404': { description: Not found }, '503': { description: Authorization unavailable } }
    put:
      tags: [Operations]
      operationId: updateAdminResource
      summary: Update a resource in authorized organization units
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:resources:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /api/admin/operations/resources/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionAdminResourceStatus
      summary: Change a resource status
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:resources:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /api/admin/operations/meetings:
    get:
      tags: [Operations]
      operationId: listAdminMeetings
      summary: List meetings in the caller effective scope
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses: { '200': { description: Scoped meetings, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingList' } } } }, '503': { description: Authorization unavailable } }
    post:
      tags: [Operations]
      operationId: createAdminMeeting
      summary: Create a meeting in an authorized organization unit
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } } }
      responses: { '201': { description: Meeting created, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '403': { description: Scope denied }, '503': { description: Authorization unavailable } }
  /api/admin/operations/meetings/{id}:
    get:
      tags: [Operations]
      operationId: getAdminMeeting
      summary: Get a meeting in the caller effective scope
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:read
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Meeting detail, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingDetail' } } } }, '403': { description: Scope denied }, '404': { description: Not found }, '503': { description: Authorization unavailable } }
    put:
      tags: [Operations]
      operationId: updateAdminMeeting
      summary: Update a meeting in authorized organization units
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /api/admin/operations/meetings/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionAdminMeetingStatus
      summary: Change a meeting status
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /api/admin/operations/meetings/{id}/overrides/{date}:
    put:
      tags: [Operations]
      operationId: putAdminMeetingOverride
      summary: Put a meeting occurrence override
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OccurrenceDate' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OccurrenceOverrideInput' } } } }
      responses: { '200': { description: Meeting override, content: { application/json: { schema: { $ref: '#/components/schemas/OccurrenceOverride' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
    delete:
      tags: [Operations]
      operationId: deleteAdminMeetingOverride
      summary: Delete a meeting occurrence override
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/OccurrenceDate' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /api/admin/operations/meetings/{id}/collections:
    put:
      tags: [Operations]
      operationId: replaceAdminMeetingCollections
      summary: Replace a meeting collection binding set
      x-hhc-visibility: admin
      x-hhc-required-permission: operations:meetings:write
      security: [{ gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionBindingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '403': { description: Scope denied }, '412': { description: Version mismatch }, '503': { description: Authorization unavailable } }
  /priv/operations/org-units:
    get:
      tags: [Operations]
      operationId: listOrgUnits
      summary: List organization units for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses:
        '200': { description: Organization units }
        '401': { description: Missing caller identity }
        '403': { description: Caller is not allowlisted }
    post:
      tags: [Operations]
      operationId: createOrgUnit
      summary: Create an organization unit
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/org-units/{id}:
    get:
      tags: [Operations]
      operationId: getOrgUnit
      summary: Get an organization unit for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Organization unit }
        '404': { description: Organization unit not found }
    put:
      tags: [Operations]
      operationId: updateOrgUnit
      summary: Update an organization unit
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitInput' } } } }
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid mutation }, '412': { description: Version mismatch } }
  /priv/operations/org-units/{id}/{action}:
    post:
      tags: [Operations]
      operationId: transitionOrgUnitStatus
      summary: Change an organization unit status
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }, { $ref: '#/components/parameters/StatusAction' }, { $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '200': { description: Organization unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnit' } } } }, '400': { description: Invalid or same-state transition }, '412': { description: Version mismatch } }
  /priv/operations/meetings:
    get:
      tags: [Operations]
      operationId: listMeetings
      summary: List operational meetings for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses:
        '200': { description: Meetings }
    post:
      tags: [Operations]
      operationId: createMeeting
      summary: Create a meeting kernel record
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingInput' } } } }
      responses: { '200': { description: Meeting, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/resources:
    get:
      tags: [Operations]
      operationId: listResources
      summary: List resources for an allowlisted service caller
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      responses: { '200': { description: Resources } }
    post:
      tags: [Operations]
      operationId: createResource
      summary: Create a resource kernel record
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [], gatewayPrincipal: [] }]
      parameters: [{ $ref: '#/components/parameters/ActorUserID' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses: { '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }, '400': { description: Invalid mutation }, '409': { description: Conflict } }
  /priv/operations/resources/{id}:
    get:
      tags: [Operations]
      operationId: getResource
      summary: Get a resource
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
      security: [{ daprCallerAppID: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { description: Resource }, '404': { description: Resource not found } }
    put:
      tags: [Operations]
      operationId: updateResource
      summary: Update a resource
      x-hhc-visibility: private
      x-hhc-callers: [hhc-web-api]
