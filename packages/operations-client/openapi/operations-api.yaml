        '503': { $ref: '#/components/responses/NotReady' }
components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ActorUserID: { name: X-HHC-User-ID, in: header, required: true, schema: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' } }
    StatusAction: { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, restore, archive] } }
    OccurrenceDate: { name: date, in: path, required: true, schema: { type: string, format: date } }
    OrgUnitID: { name: orgUnitId, in: query, schema: { type: string, format: uuid } }
    Status: { name: status, in: query, schema: { type: string } }
    IncludeArchived: { name: includeArchived, in: query, schema: { type: boolean, default: false } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
  schemas:
    OperationStatus:
      type: string
      enum: [active, paused, archived]
    OrgUnitKind:
      type: string
      enum: [church, family, small_group, fellowship]
    Visibility:
      type: string
      enum: [public, internal]
    OrgUnitInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
        email: { type: string, format: email, maxLength: 254 }
        description: { type: string }
        parentId: { type: string, format: uuid }
    OrgUnit:
      type: object
      additionalProperties: false
      required: [id, kind, name, status, version]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
        email: { type: string, format: email, maxLength: 254 }
        description: { type: string }
        parentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
    OrgUnitList:
      type: array
      items: { $ref: '#/components/schemas/OrgUnit' }
    OrgUnitBatchItem:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
        email: { type: string, format: email, maxLength: 254 }
        description: { type: string }
        parentId: { type: string, format: uuid }
        parentIndex: { type: integer, minimum: 0 }
    OrgUnitBatchInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/OrgUnitBatchItem' } }
    DependencyCount:
      type: object
      additionalProperties: false
      required: [active, total]
      properties:
        active: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    OrgUnitDependencies:
      type: object
      additionalProperties: false
      required: [children, churchMemberships, affiliations, responsibilities, scopedGrants, meetings, resources, transfers, canArchive, canDelete]
      properties:
        children: { $ref: '#/components/schemas/DependencyCount' }
        churchMemberships: { $ref: '#/components/schemas/DependencyCount' }
        affiliations: { $ref: '#/components/schemas/DependencyCount' }
        responsibilities: { $ref: '#/components/schemas/DependencyCount' }
        scopedGrants: { $ref: '#/components/schemas/DependencyCount' }
        meetings: { $ref: '#/components/schemas/DependencyCount' }
        resources: { $ref: '#/components/schemas/DependencyCount' }
        transfers: { $ref: '#/components/schemas/DependencyCount' }
        canArchive: { type: boolean }
        canDelete: { type: boolean }
    DeleteConfirmation:
      type: object
      additionalProperties: false
      required: [confirmId]
      properties:
        confirmId: { type: string, format: uuid }
    ResourceInput:
      type: object
      additionalProperties: false
      required: [key, name, kind, churchUnitId, timezone, visibility]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, const: venue }
        churchUnitId: { type: string, format: uuid }
        locationContentId: { type: string, format: uuid }
        timezone: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Resource:
      type: object
      required: [id, key, name, kind, churchUnitId, timezone, visibility, reservationEnabled, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, const: venue }
        churchUnitId: { type: string, format: uuid }
        locationContentId: { type: string, format: uuid }
        timezone: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        reservationEnabled: { type: boolean }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
    ResourceList:
      type: array
      items: { $ref: '#/components/schemas/Resource' }
    OperationOptions:
      type: object
      additionalProperties: false
      required: [orgUnits, resources]
      properties:
        orgUnits: { $ref: '#/components/schemas/OrgUnitList' }
        resources: { $ref: '#/components/schemas/ResourceList' }
    Schedule:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [weekly, once] }
        daysOfWeek: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        startsAt: { type: string, format: date-time }
    PublicOccurrence:
      type: object
      additionalProperties: false
      required: [occurrenceId, meetingKey, startsAt, endsAt, status]
      properties:
        occurrenceId: { type: string }
        meetingKey: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
    PublicOccurrenceList:
      type: array
      items: { $ref: '#/components/schemas/PublicOccurrence' }
    PublicMeeting:
      type: object
      additionalProperties: false
      required: [key, name, timezone, schedule, durationMinutes]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        nextOccurrence: { $ref: '#/components/schemas/PublicOccurrence' }
    PublicMeetingList:
      type: array
      items: { $ref: '#/components/schemas/PublicMeeting' }
    MeetingInput:
      type: object
      additionalProperties: false
      required: [key, name, churchUnitId, venueResourceId, timezone, schedule, durationMinutes, visibility]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Meeting:
      type: object
      required: [id, key, name, churchUnitId, venueResourceId, timezone, schedule, durationMinutes, visibility, status, version]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        timezone: { type: string }
        schedule: { $ref: '#/components/schemas/Schedule' }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/OperationStatus' }
        version: { type: integer, minimum: 1 }
        nextOccurrence: { $ref: '#/components/schemas/Occurrence' }
    Occurrence:
      type: object
      required: [meetingName, occurrenceDate, timezone, occurrenceId, meetingId, meetingKey, churchUnitId, venueResourceId, startsAt, endsAt, status, version]
      properties:
        meetingName: { type: string }
        occurrenceDate: { type: string, format: date }
        timezone: { type: string }
        occurrenceId: { type: string }
        meetingId: { type: string, format: uuid }
        meetingKey: { type: string }
        churchUnitId: { type: string, format: uuid }
        venueResourceId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled] }
        version: { type: integer, minimum: 1 }
    MeetingList:
      type: array
      items: { $ref: '#/components/schemas/Meeting' }
    MediaSyncWindow:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    MediaSyncWindowsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MediaSyncWindow' } }
    MeetingDetail:
      allOf:
        - { $ref: '#/components/schemas/Meeting' }
        - type: object
          required: [overrides, collectionIds]
          properties:
            overrides: { type: array, items: { $ref: '#/components/schemas/OccurrenceOverride' } }
            collectionIds: { type: array, items: { type: string } }
    OccurrenceOverrideInput:
      type: object
      additionalProperties: false
      required: [cancelled]
      properties:
        cancelled: { type: boolean }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        venueResourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
    OccurrenceOverride:
      type: object
      required: [meetingId, occurrenceDate, cancelled, version]
      properties:
        meetingId: { type: string, format: uuid }
        occurrenceDate: { type: string, format: date }
        cancelled: { type: boolean }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        venueResourceId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
        version: { type: integer, minimum: 1 }
    CollectionBindingInput:
      type: object
      additionalProperties: false
      required: [collectionIds]
      properties:
        collectionIds: { type: array, items: { type: string, minLength: 1, maxLength: 200 } }
    MembershipStatus:
      type: string
      enum: [pending, active, ended, rejected]
    AssignmentStatus:
      type: string
      enum: [active, revoked]
    OrgRoleName:
      type: string
      enum: [church_membership_manager, meeting_manager, resource_manager, reservation_approver]
    EntitlementCode:
      type: string
      enum: [bulletin.general.zh-Hant.access, bulletin.general.zh-Hans.access, bulletin.general.en.access]
    AccountResolutionInput:
      type: object
      additionalProperties: false
      required: [email, churchOrgUnitId]
      properties:
        email: { type: string, format: email }
        churchOrgUnitId: { type: string, format: uuid }
    AccountReference:
      type: object
      additionalProperties: false
      required: [accountUserId, email, displayName]
      properties:
        accountUserId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
    Member:
      type: object
      additionalProperties: false
      required: [id, accountUserId, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountUserId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemberView:
      allOf:
        - { $ref: '#/components/schemas/Member' }
        - type: object
          properties:
            account:
              oneOf:
                - { $ref: '#/components/schemas/AccountReference' }
                - { type: 'null' }
    MemberViewList:
      type: array
      items: { $ref: '#/components/schemas/MemberView' }
    MemberCreateInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        initialOrgUnitIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    MembershipRequestInput:
      type: object
      additionalProperties: false
      required: [email, churchOrgUnitId, requestedOrgUnitId]
      properties:
        email: { type: string, format: email }
        churchOrgUnitId: { type: string, format: uuid }
        requestedOrgUnitId: { type: string, format: uuid }
    MemberBatchInput:
      type: object
      additionalProperties: false
      required: [churchOrgUnitId, members]
      properties:
        churchOrgUnitId: { type: string, format: uuid }
        members: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/MemberCreateInput' } }
    UnitMemberBatchInput:
      type: object
      additionalProperties: false
      required: [accountUserIds]
      properties:
        accountUserIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
    JoinCandidate:
      type: object
      additionalProperties: false
      required: [account, state]
      properties:
        account: { $ref: '#/components/schemas/AccountReference' }
        memberId: { type: string, format: uuid }
        state: { type: string, enum: [available, already_joined, transfer_required] }
    JoinCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JoinCandidate' } }
        page: { type: integer, minimum: 1 }
        nextPage: { type: integer, minimum: 2 }
    UnitMemberPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MemberView' } }
        page: { type: integer, minimum: 1 }
        nextPage: { type: integer, minimum: 2 }
    MemberBatchResult:
      type: object
      additionalProperties: false
      required: [index, status]
      properties:
        index: { type: integer, minimum: 0 }
        status: { type: string, enum: [completed, failed] }
        member: { $ref: '#/components/schemas/Member' }
        churchMembership: { $ref: '#/components/schemas/ChurchMembership' }
        error: { type: string, enum: [account_not_found, invalid_email, conflict, not_found, out_of_scope, invalid_request] }
    ChurchMembership:
      type: object
      additionalProperties: false
      required: [id, memberId, churchOrgUnitId, status, requestedBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        churchOrgUnitId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        requestedOrgUnitId: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        endedBy: { type: string, format: uuid }
        endedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChurchMembershipList:
      type: array
      items: { $ref: '#/components/schemas/ChurchMembership' }
    OrgMembershipInput:
      type: object
      additionalProperties: false
      required: [memberId, orgUnitId]
      properties:
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
    OrgMembership:
      type: object
      additionalProperties: false
      required: [id, memberId, orgUnitId, addedBy, addedAt, version]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        addedBy: { type: string, format: uuid }
        addedAt: { type: string, format: date-time }
        removedBy: { type: string, format: uuid }
        removedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrgMembershipRemovalInput:
      type: object
      additionalProperties: false
      properties:
        endChurchMembership: { type: boolean }
    EntitlementInput:
      type: object
      additionalProperties: false
      required: [memberId, entitlementCode, source]
      properties:
        memberId: { type: string, format: uuid }
        entitlementCode: { $ref: '#/components/schemas/EntitlementCode' }
        source: { type: string, enum: [manual_assignment, event_registration] }
    Entitlement:
      type: object
      additionalProperties: false
      required: [id, memberId, entitlementCode, source, status, assignedBy, assignedAt, version]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        entitlementCode: { $ref: '#/components/schemas/EntitlementCode' }
        source: { type: string, enum: [manual_assignment, event_registration] }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedBy: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    OrgRoleInput:
      type: object
      additionalProperties: false
      required: [memberId, orgUnitId, role]
      properties:
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
    OrgRole:
      type: object
      additionalProperties: false
      required: [id, memberId, orgUnitId, role, status, assignedBy, assignedAt, version]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
        status: { type: string, enum: [active, revoked] }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedBy: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    UnitResponsibilityInput:
      type: object
      additionalProperties: false
      required: [memberId, orgUnitId]
      properties:
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
    UnitResponsibility:
      type: object
      additionalProperties: false
      required: [id, memberId, orgUnitId, status, assignedBy, assignedAt, version]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedBy: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MembershipTransferInput:
      type: object
      additionalProperties: false
      required: [memberId, targetChurchOrgUnitId]
      properties:
        memberId: { type: string, format: uuid }
        targetChurchOrgUnitId: { type: string, format: uuid }
        initialOrgUnitIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        reason: { type: string, maxLength: 500 }
    MembershipTransfer:
      type: object
      additionalProperties: false
      required: [id, memberId, sourceChurchOrgUnitId, targetChurchOrgUnitId, status, initiatedBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        sourceChurchOrgUnitId: { type: string, format: uuid }
        targetChurchOrgUnitId: { type: string, format: uuid }
        status: { type: string, enum: [pending_source_approval, pending_target_approval, completed, rejected, cancelled] }
        reason: { type: string, maxLength: 500 }
        initialOrgUnitIds: { type: array, items: { type: string, format: uuid } }
        initiatedBy: { type: string, format: uuid }
        sourceApprovedBy: { type: string, format: uuid }
        sourceApprovedAt: { type: string, format: date-time }
        targetApprovedBy: { type: string, format: uuid }
        targetApprovedAt: { type: string, format: date-time }
        completedBy: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MembershipTransferList:
      type: array
      items: { $ref: '#/components/schemas/MembershipTransfer' }
    OrgMembershipList:
      type: array
      items: { $ref: '#/components/schemas/OrgMembership' }
    UnitResponsibilityList:
      type: array
      items: { $ref: '#/components/schemas/UnitResponsibility' }
    EntitlementList:
      type: array
      items: { $ref: '#/components/schemas/Entitlement' }
    OrgRoleList:
      type: array
      items: { $ref: '#/components/schemas/OrgRole' }
    EntitlementCheckRequest:
      type: object
      additionalProperties: false
      required: [subjectId, entitlementCodes]
      properties:
        subjectId: { type: string, format: uuid }
        entitlementCodes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, pattern: '^[a-z][A-Za-z0-9.-]{0,99}$' }
    EntitlementDecision:
      type: object
      additionalProperties: false
      required: [entitlementCode, decision, reason, version]
      properties:
        entitlementCode: { type: string }
        decision: { type: string, enum: [allow, deny] }
        reason: { type: string, enum: [allowed, membership_required, entitlement_required] }
        version: { type: string, pattern: '^[0-9a-f]{64}$' }
    EntitlementCheckResponse:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          items: { $ref: '#/components/schemas/EntitlementDecision' }
    OrgUnitSummary:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OrgUnitKind' }
        name: { type: string }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [membershipId, orgUnit]
      properties:
        membershipId: { type: string, format: uuid }
        orgUnit: { $ref: '#/components/schemas/OrgUnitSummary' }
    ChurchMembershipSummary:
      type: object
      additionalProperties: false
      required: [membershipId, church]
      properties:
        membershipId: { type: string, format: uuid }
        church: { $ref: '#/components/schemas/OrgUnitSummary' }
    OrgRoleSummary:
      type: object
      additionalProperties: false
      required: [assignmentId, role, orgUnit]
      properties:
        assignmentId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/OrgRoleName' }
        orgUnit: { $ref: '#/components/schemas/OrgUnitSummary' }
    UnitResponsibilitySummary:
      type: object
      additionalProperties: false
      required: [responsibilityId, orgUnit]
      properties:
        responsibilityId: { type: string, format: uuid }
        orgUnit: { $ref: '#/components/schemas/OrgUnitSummary' }
    EntitlementSummary:
      type: object
      additionalProperties: false
      required: [assignmentId, entitlementCode]
      properties:
        assignmentId: { type: string, format: uuid }
        entitlementCode: { type: string }
    AccessSnapshot:
      type: object
      additionalProperties: false
      required: [memberships, orgRoles, responsibilities, entitlements, version]
      properties:
        memberId: { type: string, format: uuid }
        churchMembership: { $ref: '#/components/schemas/ChurchMembershipSummary' }
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipSummary' } }
        orgRoles: { type: array, items: { $ref: '#/components/schemas/OrgRoleSummary' } }
        responsibilities: { type: array, items: { $ref: '#/components/schemas/UnitResponsibilitySummary' } }
        entitlements: { type: array, items: { $ref: '#/components/schemas/EntitlementSummary' } }
        version: { type: string, pattern: '^[0-9a-f]{64}$' }
    DSRExportRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId]
      properties:
        requestId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        userId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        cursor: { type: string, maxLength: 1024 }
        limit: { type: integer, minimum: 0, maximum: 100 }
    DSRActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId, action, idempotencyKey]
      properties:
        requestId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        userId: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[47][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$' }
        action: { type: string, enum: [restrict_processing, erase] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    DSRException:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, enum: [audit_retained, central_audit_outbox_retained, shared_operations_retained, relationship_attribution_retained, reservation_history_retained, reservation_attribution_retained, processing_restriction_retained, dsr_action_result_retained] }
        count: { type: integer, format: int64, minimum: 0 }
    DSRExportRecord:
      type: object
      additionalProperties: false
      required: [recordType, recordKey, data]
      properties:
        recordType: { type: string, enum: [member, church_membership, org_membership, org_role_assignment, unit_responsibility, membership_transfer, entitlement_assignment, resource_reservation] }
        recordKey: { type: string, format: uuid }
        data: { type: object, additionalProperties: true }
    DSRExportPage:
      type: object
      additionalProperties: false
      required: [records, recordCount, exceptions]
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/DSRExportRecord' } }
        nextCursor: { type: string }
        recordCount: { type: integer, minimum: 0 }
        exceptions: { type: array, items: { $ref: '#/components/schemas/DSRException' } }
    DSRExportEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/DSRExportPage' } }
    DSRActionResult:
      type: object
      additionalProperties: false
      required: [owner, action, status, recordCount, reasonCodes]
      properties:
        owner: { type: string, const: operations-api }
        action: { type: string, enum: [restrict_processing, erase] }
        status: { type: string, const: completed }
        recordCount: { type: integer, format: int64, minimum: 0 }
        reasonCodes: { type: array, items: { type: string, enum: [audit_retained, shared_operations_retained, reservation_history_retained, reservation_attribution_retained, processing_restriction_retained] } }
    DSRActionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/DSRActionResult' } }
    ReservationStatus:
      type: string
      enum: [requested, approved, rejected, cancelled]
    ReservableResource:
      type: object
      additionalProperties: false
      required: [id, key, name, timezone]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        timezone: { type: string }
    BusyInterval:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Availability:
      type: object
      additionalProperties: false
      required: [busyIntervals]
      properties: { busyIntervals: { type: array, items: { $ref: '#/components/schemas/BusyInterval' } } }
    ResourceReservationInput:
      type: object
      additionalProperties: false
      required: [resourceId, purpose, startsAt, endsAt]
      properties:
        resourceId: { type: string, format: uuid }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Exclusive end; the interval is half-open and may not exceed 366 days. }
    ResourceReservation:
      type: object
      additionalProperties: false
      required: [id, resourceId, requesterUserId, purpose, startsAt, endsAt, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        requesterUserId: { type: string, format: uuid }
        purpose: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        decidedBy: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    ReservationSettings:
      type: object
      additionalProperties: false
      required: [resourceId, enabled, version]
      properties:
        resourceId: { type: string, format: uuid }
        enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    ResourceMaintenanceInput:
      type: object
      additionalProperties: false
      required: [resourceId, reason, startsAt, endsAt]
      properties:
        resourceId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Exclusive end; the interval is half-open and may not exceed 366 days. }
    ResourceMaintenanceBlock:
      type: object
      additionalProperties: false
      required: [id, resourceId, reason, startsAt, endsAt, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [active, cancelled] }
        createdBy: { type: string, format: uuid }
        cancelledBy: { type: string, format: uuid }
        cancelledAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: healthy }
    Ready:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ready }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  securitySchemes:
    daprCallerAppID:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Dapr API token required for private Operations service calls.
    workloadPrincipal:
      type: apiKey
      in: header
      name: X-MS-CLIENT-PRINCIPAL
      description: Injected by Azure Container Apps after exact workload identity validation.
    gatewayPrincipal:
      type: apiKey
      in: header
      name: X-HHC-User-ID
      description: Trusted canonical Account subject injected by the Gateway or propagated by an allowlisted internal caller.
  responses:
    ProtectedHeaderRejected:
      description: A gateway-protected identity header is invalid on a public route.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotReady:
      description: PostgreSQL is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
